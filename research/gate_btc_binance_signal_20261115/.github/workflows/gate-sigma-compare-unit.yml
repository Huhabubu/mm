name: Gate sigma 90pct vs 95pct fee comparison regression
on:
  push:
    paths:
      - '.github/workflows/gate-sigma-compare-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/test_gate_sigma_compare.py
