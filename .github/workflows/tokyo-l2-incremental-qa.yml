name: Tokyo L2 incremental partitioned QA (event-driven + 3h catch-up)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tokyo-l2-incremental-qa.yml"
  schedule:
    # Low-frequency staggered 3-hour catch-up (primary trigger is EC2 archive-verified workflow_dispatch).
    # Recovers missed notifications or runs replaced in the concurrency queue and reports 4-way window status.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      target_window_utc:
        description: "Explicit verified UTC window start to inspect first (YYYY-MM-DDTHH:MMZ; set by EC2 archive notifier)"
        required: false
        type: string
        default: ""
      archive_revision:
        description: "Expected deterministic sha256 archive_revision for target_window_utc verified manifests"
        required: false
        type: string
        default: ""
      run_id:
        description: "Active collection batch run_id (defaults to vars.TOKYO_L2_QA_RUN_ID)"
        required: false
        type: string
        default: ""
      since_window:
        description: "Actual cutover UTC window start (YYYY-MM-DDTHH:MMZ; defaults to vars.TOKYO_L2_QA_SINCE_WINDOW)"
        required: false
        type: string
        default: ""
      since_date:
        description: "Earliest UTC date to inspect (YYYY-MM-DD; auto-derived from since_window when empty)"
        required: false
        type: string
        default: ""
      config_path:
        description: "Effective collector config path in source repo (defaults to vars.TOKYO_L2_QA_CONFIG_PATH)"
        required: false
        type: string
        default: ""
      limit:
        description: "Max unchecked partitions per run (default: 16 dispatch, 48 3h catch-up, 4 push)"
        required: false
        type: string
        default: ""
      sla_grace_minutes:
        description: "Minutes after window end before missing archive becomes overdue"
        required: false
        type: string
        default: "10"
      force:
        description: "Recheck already recorded partitions"
        type: boolean
        required: false
        default: false
      replay_window:
        description: "Run isolated real-data QA for this complete UTC window"
        required: false
        type: string
        default: ""
      replay_seconds:
        description: "BTC input duration including 600s strategy warmup (0 for protocol-only)"
        required: false
        type: string
        default: "660"
      preview_recurring:
        description: "Exercise the normal QA jobs with temporary report state and no notifications"
        required: false
        type: boolean
        default: false
      source_ref:
        description: "Preview-only collector QA branch/SHA override (ignored outside preview_recurring / replay_window)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ (inputs.replay_window || inputs.preview_recurring) && format('tokyo-l2-qa-preview-{0}', github.ref_name) || 'tokyo-l2-incremental-qa' }}
  cancel-in-progress: false

jobs:
  hourly-qa:
    if: ${{ inputs.replay_window == '' || inputs.replay_window == null }}
    name: Incremental partitioned QA (file / window / UTC day / protocol)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Record job start timestamp and trigger mode
        id: job_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_WINDOW: ${{ inputs.target_window_utc }}
        shell: bash
        run: |
          set -euo pipefail
          JOB_STARTED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            TRIGGER_MODE="schedule_catchup"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            TRIGGER_MODE="push_smoke"
          elif [[ -n "$INPUT_TARGET_WINDOW" ]]; then
            TRIGGER_MODE="archive_dispatch"
          else
            TRIGGER_MODE="manual_dispatch"
          fi
          echo "QA_JOB_STARTED_AT_UTC=${JOB_STARTED_AT_UTC}" >> "$GITHUB_ENV"
          echo "QA_TRIGGER_MODE=${TRIGGER_MODE}" >> "$GITHUB_ENV"
          echo "job_started_at_utc=${JOB_STARTED_AT_UTC}" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=${TRIGGER_MODE}" >> "$GITHUB_OUTPUT"
          echo "QA job started at ${JOB_STARTED_AT_UTC} (trigger_mode=${TRIGGER_MODE}, target_window_utc=${INPUT_TARGET_WINDOW:-none})"

      - name: Check out GitHub protocol and replay validation
        uses: actions/checkout@v4
        with:
          path: workflow_code
          sparse-checkout: |
            scripts/tokyo_l2_protocol_qa.py
            scripts/tokyo_l2_replay_qa.py
            scripts/tokyo_l2_recurring_qa.py
            scripts/test_tokyo_l2_protocol_qa.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout collector QA code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.preview_recurring && inputs.source_ref || 'feat/tokyo-l2-reliability-fixes' }}
          path: source
          persist-credentials: false

      - name: Record checker commit SHA
        id: checker_meta
        shell: bash
        run: |
          set -euo pipefail
          CHECKER_COMMIT="$(git -C source rev-parse HEAD)"
          echo "TOKYO_L2_QA_CHECKER_COMMIT=${CHECKER_COMMIT}" >> "$GITHUB_ENV"
          echo "checker_commit=${CHECKER_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Using QA checker commit: ${CHECKER_COMMIT}"

      - name: Checkout persistent QA reports (summary-only state branch)
        uses: actions/checkout@v4
        with:
          ref: tokyo-l2-qa-state
          path: state
          sparse-checkout: |
            qa_reports

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded QA dependencies
        run: |
          python -m pip install hftbacktest==2.4.4 numpy numba zstandard==0.23.0
          PYTHONPATH=source/collector/python python workflow_code/scripts/test_tokyo_l2_protocol_qa.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Configure read-only Google Drive access
        env:
          QA_SERVICE_ACCOUNT: ${{ secrets.TOKYO_L2_QA_GDRIVE_SA_JSON }}
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "$QA_SERVICE_ACCOUNT" ]]; then missing+=("TOKYO_L2_QA_GDRIVE_SA_JSON"); fi
          if [[ -z "$QA_FOLDER_ID" ]]; then missing+=("TOKYO_L2_QA_GDRIVE_FOLDER_ID"); fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}. Configure read-only Google Drive Viewer credentials under Settings -> Secrets and variables -> Actions."
            exit 2
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/tokyo-qa-auth"
          printf '%s' "$QA_SERVICE_ACCOUNT" > "$RUNNER_TEMP/tokyo-qa-auth/service-account.json"
          printf '[qa]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$RUNNER_TEMP/tokyo-qa-auth/service-account.json" "$QA_FOLDER_ID" \
            > "$RUNNER_TEMP/tokyo-qa-auth/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" rclone lsf qa:meta --max-depth 1 > /dev/null
          INDEX_MODTIME_UTC="$(RCLONE_CONFIG="$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" rclone lsjson qa:meta --files-only --max-depth 1 2>/dev/null | python -c 'import json, sys; arr = json.load(sys.stdin); hit = [x for x in (arr if isinstance(arr, list) else []) if x.get("Name") == "archive_manifest_index.json"]; print(hit[0].get("ModTime", "") if hit else "")' 2>/dev/null || true)"
          echo "QA_INDEX_MODTIME_UTC=${INDEX_MODTIME_UTC}" >> "$GITHUB_ENV"
          echo "Drive archive_manifest_index.json ModTime (UTC): ${INDEX_MODTIME_UTC:-unavailable}"

      - name: Inspect verified archived partitions (file, window, UTC day)
        id: inspect
        env:
          QA_CONFIG_PATH: ${{ inputs.config_path || vars.TOKYO_L2_QA_CONFIG_PATH }}
          QA_SINCE_DATE: ${{ inputs.since_date || vars.TOKYO_L2_QA_SINCE_DATE }}
          QA_SINCE_WINDOW: ${{ inputs.since_window || vars.TOKYO_L2_QA_SINCE_WINDOW }}
          QA_RUN_ID: ${{ inputs.run_id || vars.TOKYO_L2_QA_RUN_ID }}
          QA_TARGET_WINDOW_UTC: ${{ inputs.target_window_utc }}
          QA_ARCHIVE_REVISION: ${{ inputs.archive_revision }}
          QA_LIMIT: ${{ inputs.limit != '' && inputs.limit || (github.event_name == 'push' && '4' || (github.event_name == 'schedule' && '48' || '16')) }}
          QA_SLA_GRACE_MINUTES: ${{ inputs.sla_grace_minutes || '10' }}
          QA_FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          missing_bindings=()
          if [[ -z "$QA_CONFIG_PATH" ]]; then missing_bindings+=("TOKYO_L2_QA_CONFIG_PATH (or input config_path)"); fi
          if [[ -z "$QA_SINCE_WINDOW" ]]; then missing_bindings+=("TOKYO_L2_QA_SINCE_WINDOW (or input since_window)"); fi
          if [[ -z "$QA_RUN_ID" ]]; then missing_bindings+=("TOKYO_L2_QA_RUN_ID (or input run_id)"); fi
          if (( ${#missing_bindings[@]} > 0 )); then
            echo "::error::Scheduled/incremental QA must be explicitly bound to the active cutover time, batch run_id, and effective config. Missing: ${missing_bindings[*]}. Configure these under Settings -> Secrets and variables -> Actions -> Variables before enabling scheduled QA."
            exit 2
          fi
          if [[ ! -f "source/${QA_CONFIG_PATH}" ]]; then
            echo "::error::Bound collector config 'source/${QA_CONFIG_PATH}' does not exist."
            exit 2
          fi
          if [[ -z "$QA_SINCE_DATE" ]]; then
            QA_SINCE_DATE="${QA_SINCE_WINDOW:0:10}"
          fi
          echo "QA_BOUND_RUN_ID=${QA_RUN_ID}" >> "$GITHUB_ENV"
          echo "QA_BOUND_SINCE_WINDOW=${QA_SINCE_WINDOW}" >> "$GITHUB_ENV"
          echo "QA_BOUND_CONFIG_PATH=${QA_CONFIG_PATH}" >> "$GITHUB_ENV"

          extra=(
            --since-window "$QA_SINCE_WINDOW"
            --run-id "$QA_RUN_ID"
            --trigger-mode "$QA_TRIGGER_MODE"
          )
          if [[ -n "$QA_TARGET_WINDOW_UTC" ]]; then
            extra+=(--target-window "$QA_TARGET_WINDOW_UTC")
          fi
          if [[ -n "$QA_ARCHIVE_REVISION" ]]; then
            extra+=(--archive-revision "$QA_ARCHIVE_REVISION")
          fi
          if [[ "$QA_FORCE" == "true" ]]; then
            extra+=(--force)
          fi

          set +e
          python source/collector/python/hourly_incremental_qa.py \
            --remote "qa:" \
            --config "source/${QA_CONFIG_PATH}" \
            --state-dir state \
            --since-date "$QA_SINCE_DATE" \
            --checker-commit "$TOKYO_L2_QA_CHECKER_COMMIT" \
            --sla-grace-minutes "$QA_SLA_GRACE_MINUTES" \
            --limit "$QA_LIMIT" \
            "${extra[@]}" | tee "$RUNNER_TEMP/qa_summary.json"
          QA_RC=${PIPESTATUS[0]}
          set -e

          python - "$RUNNER_TEMP/qa_summary.json" "$GITHUB_STEP_SUMMARY" "$GITHUB_ENV" <<'PY'
          import json, os, sys
          summary_path, md_path, env_path = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              data = json.loads(open(summary_path, encoding="utf-8").read())
          except Exception as exc:
              with open(md_path, "a", encoding="utf-8") as out:
                  out.write(f"## Tokyo L2 Incremental QA\n\nFailed to parse QA summary JSON: `{exc}`\n")
              with open(env_path, "a", encoding="utf-8") as env_out:
                  env_out.write("QA_HEARTBEAT_STATUS=failed\n")
                  env_out.write("QA_JOB_EXECUTION_STATUS=failed\n")
                  env_out.write("QA_CURRENT_WINDOW_COMPLETED=false\n")
                  env_out.write("QA_CURRENT_WINDOW_VERIFICATION_STATUS=parse_error\n")
              sys.exit(0)

          hb_status = str(data.get("heartbeat_status") or ("ok" if data.get("status") == "ok" else "failed"))
          job_status = str(data.get("job_execution_status") or "failed")
          cur_wid = str(data.get("current_window_id") or "")
          cur_done = "true" if data.get("current_window_completed") is True else "false"
          cur_vstatus = str(data.get("current_window_verification_status") or "unknown")
          hist_status = str(data.get("historical_data_quality_status") or "unknown")
          hist_wins = data.get("historical_damaged_windows") or []
          hist_overdue = data.get("historical_overdue_windows") or []
          hist_parts = data.get("historical_damaged_partitions") or []
          hist_loss_mfs = data.get("historical_loss_manifests") or []

          wc = data.get("window_classification") or {}
          not_archived = wc.get("not_archived", data.get("not_archived_windows") or [])
          archived_pending_qa = wc.get("archived_pending_qa", data.get("archived_pending_qa_windows") or [])
          verified_failed = wc.get("verified_failed", data.get("failed_windows") or [])
          verified_passed = wc.get("verified_passed", data.get("passed_windows") or [])
          verified_review = wc.get("verified_needs_review", data.get("review_windows") or [])

          target_wid = str(data.get("target_window_utc") or "")
          obs_rev = str(data.get("observed_archive_revision") or "")
          exp_rev = str(data.get("expected_archive_revision") or "")
          reused = "true" if data.get("target_window_reused_result") is True else "false"
          latest_ver_wid = str(data.get("latest_verified_window_id") or "")
          latest_ver_status = str(data.get("latest_verified_window_status") or "")

          with open(env_path, "a", encoding="utf-8") as env_out:
              env_out.write(f"QA_HEARTBEAT_STATUS={hb_status}\n")
              env_out.write(f"QA_JOB_EXECUTION_STATUS={job_status}\n")
              env_out.write(f"QA_CURRENT_WINDOW_ID={cur_wid}\n")
              env_out.write(f"QA_CURRENT_WINDOW_COMPLETED={cur_done}\n")
              env_out.write(f"QA_CURRENT_WINDOW_VERIFICATION_STATUS={cur_vstatus}\n")
              env_out.write(f"QA_TARGET_WINDOW_RESOLVED={target_wid}\n")
              env_out.write(f"QA_OBSERVED_ARCHIVE_REVISION={obs_rev}\n")
              env_out.write(f"QA_TARGET_WINDOW_REUSED={reused}\n")
              env_out.write(f"QA_INSPECT_STARTED_AT_UTC={data.get('started_at_utc') or ''}\n")
              env_out.write(f"QA_INSPECT_COMPLETED_AT_UTC={data.get('completed_at_utc') or ''}\n")
              env_out.write(f"QA_LATEST_VERIFIED_WINDOW_ID={latest_ver_wid}\n")
              env_out.write(f"QA_LATEST_VERIFIED_WINDOW_STATUS={latest_ver_status}\n")
              env_out.write(f"QA_NOT_ARCHIVED_WINDOWS_COUNT={len(not_archived)}\n")
              env_out.write(f"QA_ARCHIVED_PENDING_QA_WINDOWS_COUNT={len(archived_pending_qa)}\n")
              env_out.write(f"QA_FAILED_WINDOWS_COUNT={len(verified_failed)}\n")
              env_out.write(f"QA_PASSED_WINDOWS_COUNT={len(verified_passed)}\n")
              env_out.write(f"QA_HISTORICAL_DATA_QUALITY_STATUS={hist_status}\n")
              env_out.write(f"QA_HISTORICAL_DAMAGED_WINDOWS_COUNT={len(hist_wins)}\n")
              env_out.write(f"QA_HISTORICAL_OVERDUE_WINDOWS_COUNT={len(hist_overdue)}\n")
              env_out.write(f"QA_HISTORICAL_LOSS_MANIFESTS_COUNT={len(hist_loss_mfs)}\n")

          lines = [
              "## Tokyo L2 Incremental QA Summary",
              f"- **Trigger & Traceability**: mode=`{data.get('trigger_mode')}` | run_id=`{data.get('effective_run_id') or data.get('run_id')}` | target_window_utc=`{target_wid or 'none'}` | expected_revision=`{exp_rev or 'none'}` | observed_revision=`{obs_rev or 'none'}` | revision_matched=`{data.get('target_revision_matched')}` | reused_result=`{reused}`",
              f"- **Timestamps (UTC)**: index_ready=`{os.environ.get('QA_INDEX_MODTIME_UTC', '') or 'unavailable'}` | job_started=`{os.environ.get('QA_JOB_STARTED_AT_UTC', '')}` | inspect_started=`{data.get('started_at_utc')}` | inspect_completed=`{data.get('completed_at_utc')}`",
              f"- **1. Job Execution Status**: `{job_status}` (discovery=`{data.get('discovery_mode')}`, retry_needed=`{data.get('retry_needed')}`)",
              f"- **2. Active Window**: `{cur_wid}` | completed=`{cur_done}` | verification_status=`{cur_vstatus}` | heartbeat_status=`{hb_status}` | latest_verified=`{latest_ver_wid or 'none'}` (`{latest_ver_status or 'none'}`)",
              f"- **3. 4-Way Window Classification**: not_archived=`{len(not_archived)}` | archived_pending_qa=`{len(archived_pending_qa)}` | verified_failed=`{len(verified_failed)}` | verified_passed=`{len(verified_passed)}` | needs_review=`{len(verified_review)}`",
              f"- **4. Historical Data Quality**: `{hist_status}` | damaged_windows=`{hist_wins}` | historical_overdue_windows=`{hist_overdue}` | damaged_partitions_count=`{len(hist_parts)}` | historical_loss_manifests_count=`{len(hist_loss_mfs)}`",
              f"- **Overall Gate**: `qa_status={data.get('qa_status')}` (`status={data.get('status')}`)",
              f"- **Binding**: config=`{data.get('partition_minutes')}m` | index_effective_run_id=`{data.get('index_effective_run_id')}` | effective_since_window=`{data.get('effective_since_window')}`",
              f"- **Checker Commit**: `{data.get('checker_commit_sha')}` (`qa_version={data.get('qa_version')}`)",
              f"- **Partitions**: eligible=`{data.get('eligible_manifest_count')}`, attempted=`{data.get('attempted')}`, ok=`{data.get('ok')}`, blocked=`{data.get('blocked')}`, needs_review=`{data.get('needs_review')}`, already_checked=`{data.get('already_checked')}`, backlog=`{data.get('remaining_backlog')}`",
              f"- **Reports Written**: windows=`{data.get('window_reports_written')}`, days=`{data.get('day_reports_written')}`",
              f"- **Not Archived (Overdue / Grace)**: `{not_archived}`",
              f"- **Archived Pending QA**: `{archived_pending_qa}`",
          ]
          with open(md_path, "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

          exit "$QA_RC"

      - name: Validate current archive protocols and hourly representative replay
        id: protocols
        if: ${{ !cancelled() && steps.inspect.outcome == 'success' }}
        env:
          PYTHONPATH: source/collector/python
        shell: bash
        run: |
          set -euo pipefail
          rules_sha="$(sha256sum workflow_code/scripts/tokyo_l2_{protocol,replay,recurring}_qa.py | sha256sum | cut -d ' ' -f1)"
          extra_proto=()
          if [[ -n "${QA_OBSERVED_ARCHIVE_REVISION:-}" ]]; then
            extra_proto+=(--archive-revision "$QA_OBSERVED_ARCHIVE_REVISION")
          fi
          if [[ -n "${QA_TRIGGER_MODE:-}" ]]; then
            extra_proto+=(--trigger-mode "$QA_TRIGGER_MODE")
          fi
          python workflow_code/scripts/tokyo_l2_recurring_qa.py \
            --remote qa: --state-dir state --config "source/$QA_BOUND_CONFIG_PATH" \
            --run-id "$QA_BOUND_RUN_ID" --cutover "$QA_BOUND_SINCE_WINDOW" \
            --current "$QA_CURRENT_WINDOW_ID" --checker "$TOKYO_L2_QA_CHECKER_COMMIT/$rules_sha" \
            "${extra_proto[@]}"

      - name: Persist QA summary reports to tokyo-l2-qa-state
        id: persist
        if: ${{ !cancelled() && !inputs.preview_recurring }}
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d qa_reports ]]; then
            echo "No qa_reports directory generated; nothing to persist."
            exit 0
          fi

          # Guardrail: state branch MUST contain ONLY summary JSON reports (no raw data or credentials).
          if find qa_reports -type f \( -name '*.tsv.zst*' -o -name '*.partial' -o -name '*.pem' -o -name '*.key' -o -name '*service-account*' -o -name '*rclone.conf*' \) | grep -q .; then
            echo "::error::Refusing to commit raw data or credential-like files to tokyo-l2-qa-state"
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa_reports
          if ! git diff --cached --quiet; then
            git commit -m "qa: record incremental Tokyo L2 reports (checker=${TOKYO_L2_QA_CHECKER_COMMIT::12})"
            for attempt in 1 2 3; do
              if git push origin HEAD:tokyo-l2-qa-state; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed; rebasing onto origin/tokyo-l2-qa-state..."
              git pull --rebase origin tokyo-l2-qa-state
              sleep $((attempt * 2))
            done
            echo "::error::Failed to persist QA summary reports to tokyo-l2-qa-state after 3 attempts"
            exit 2
          fi

      - name: Notify independent QA Healthchecks
        if: ${{ !cancelled() && !inputs.preview_recurring }}
        env:
          QA_HEALTHCHECKS_URL: ${{ secrets.TOKYO_L2_QA_HEALTHCHECKS_URL }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          PROTOCOL_OUTCOME: ${{ steps.protocols.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$QA_HEALTHCHECKS_URL" ]]; then
            echo "::warning::Secret TOKYO_L2_QA_HEALTHCHECKS_URL is NOT configured. Add a dedicated QA Healthchecks ping URL (separate from EC2 collector/archive heartbeats) under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          url="${QA_HEALTHCHECKS_URL%/}"
          hb_status="${QA_HEARTBEAT_STATUS:-failed}"
          job_status="${QA_JOB_EXECUTION_STATUS:-failed}"
          cur_wid="${QA_CURRENT_WINDOW_ID:-none}"
          cur_done="${QA_CURRENT_WINDOW_COMPLETED:-false}"
          cur_vstatus="${QA_CURRENT_WINDOW_VERIFICATION_STATUS:-unknown}"
          hist_status="${QA_HISTORICAL_DATA_QUALITY_STATUS:-unknown}"
          hist_count="${QA_HISTORICAL_DAMAGED_WINDOWS_COUNT:-0}"
          hist_overdue_count="${QA_HISTORICAL_OVERDUE_WINDOWS_COUNT:-0}"
          hist_loss_mfs_count="${QA_HISTORICAL_LOSS_MANIFESTS_COUNT:-0}"

          # Heartbeat reflects job execution + active window completion & verification independently,
          # while historical damaged, unarchived/overdue, or archived-pending-QA backlog windows are
          # preserved and reported separately in the payload without failing active-window heartbeats.
          # When the active window is not completed (cur_done != true), NEVER send a false success ping.
          status="success"
          if [[ "$INSPECT_OUTCOME" != "success" || "$PROTOCOL_OUTCOME" != "success" || "$PERSIST_OUTCOME" != "success" || "$hb_status" != "ok" || "$job_status" != "ok" || "$cur_done" != "true" || "$cur_vstatus" != "passed" ]]; then
            status="failure"
            url="${url}/fail"
          fi
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            --request POST \
            --data-urlencode "status=${status}" \
            --data-urlencode "trigger_mode=${QA_TRIGGER_MODE:-unknown}" \
            --data-urlencode "heartbeat_status=${hb_status}" \
            --data-urlencode "job_execution_status=${job_status}" \
            --data-urlencode "current_window_id=${cur_wid}" \
            --data-urlencode "current_window_completed=${cur_done}" \
            --data-urlencode "current_window_verification_status=${cur_vstatus}" \
            --data-urlencode "target_window_utc=${QA_TARGET_WINDOW_RESOLVED:-none}" \
            --data-urlencode "archive_revision=${QA_OBSERVED_ARCHIVE_REVISION:-none}" \
            --data-urlencode "latest_verified_window_id=${QA_LATEST_VERIFIED_WINDOW_ID:-none}" \
            --data-urlencode "latest_verified_window_status=${QA_LATEST_VERIFIED_WINDOW_STATUS:-none}" \
            --data-urlencode "not_archived_windows_count=${QA_NOT_ARCHIVED_WINDOWS_COUNT:-0}" \
            --data-urlencode "archived_pending_qa_windows_count=${QA_ARCHIVED_PENDING_QA_WINDOWS_COUNT:-0}" \
            --data-urlencode "failed_windows_count=${QA_FAILED_WINDOWS_COUNT:-0}" \
            --data-urlencode "passed_windows_count=${QA_PASSED_WINDOWS_COUNT:-0}" \
            --data-urlencode "historical_data_quality_status=${hist_status}" \
            --data-urlencode "historical_damaged_windows_count=${hist_count}" \
            --data-urlencode "historical_overdue_windows_count=${hist_overdue_count}" \
            --data-urlencode "historical_loss_manifests_count=${hist_loss_mfs_count}" \
            --data-urlencode "run_id=${QA_BOUND_RUN_ID:-unbound}" \
            --data-urlencode "since_window=${QA_BOUND_SINCE_WINDOW:-unbound}" \
            --data-urlencode "protocol_status=${QA_PROTOCOL_STATUS:-pending}" \
            --data-urlencode "hourly_btc_replay=${QA_HOURLY_BTC_REPLAY:-pending}" \
            --data-urlencode "checker_commit=${TOKYO_L2_QA_CHECKER_COMMIT:-unknown}" \
            "$url"

  real-data-qa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_window != '' }}
    name: Real Tokyo window protocol QA and BTC short replay
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out replay audit
        uses: actions/checkout@v4
        with:
          path: workflow_code
          sparse-checkout: |
            scripts/tokyo_l2_protocol_qa.py
            scripts/tokyo_l2_replay_qa.py
            scripts/tokyo_l2_recurring_qa.py
            scripts/test_tokyo_l2_protocol_qa.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out collector converter
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'feat/tokyo-l2-reliability-fixes' }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install replay dependencies and test wire validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install hftbacktest==2.4.4 numpy numba zstandard==0.23.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          PYTHONPATH=source/collector/python python workflow_code/scripts/test_tokyo_l2_protocol_qa.py

      - name: Configure read-only Google Drive access
        env:
          QA_SERVICE_ACCOUNT: ${{ secrets.TOKYO_L2_QA_GDRIVE_SA_JSON }}
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ -z "$QA_SERVICE_ACCOUNT" ]]; then missing+=("TOKYO_L2_QA_GDRIVE_SA_JSON"); fi
          if [[ -z "$QA_FOLDER_ID" ]]; then missing+=("TOKYO_L2_QA_GDRIVE_FOLDER_ID"); fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}. Configure read-only Google Drive Viewer credentials under Settings -> Secrets and variables -> Actions."
            exit 2
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/tokyo-qa-auth"
          printf '%s' "$QA_SERVICE_ACCOUNT" > "$RUNNER_TEMP/tokyo-qa-auth/service-account.json"
          printf '[qa]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$RUNNER_TEMP/tokyo-qa-auth/service-account.json" "$QA_FOLDER_ID" \
            > "$RUNNER_TEMP/tokyo-qa-auth/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" rclone lsf qa:meta --max-depth 1 > /dev/null

      - name: Verify archived frames and replay a real BTC sample
        env:
          QA_CONFIG_PATH: ${{ inputs.config_path || vars.TOKYO_L2_QA_CONFIG_PATH }}
          QA_RUN_ID: ${{ inputs.run_id || vars.TOKYO_L2_QA_RUN_ID }}
          QA_REPLAY_WINDOW: ${{ inputs.replay_window }}
          QA_REPLAY_SECONDS: ${{ inputs.replay_seconds || '660' }}
          PYTHONPATH: source/collector/python
        shell: bash
        run: |
          set -euo pipefail
          python workflow_code/scripts/tokyo_l2_replay_qa.py \
            --remote qa: --config "source/$QA_CONFIG_PATH" --run-id "$QA_RUN_ID" \
            --window "$QA_REPLAY_WINDOW" --replay-seconds "$QA_REPLAY_SECONDS" \
            --summary "$RUNNER_TEMP/tokyo-replay-summary.json"

      - name: Upload summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-l2-real-replay-summary
          path: ${{ runner.temp }}/tokyo-replay-summary.json
          if-no-files-found: warn
