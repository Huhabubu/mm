name: G0 queue-exposure intensity calibration

on:
  push:
    paths:
      - 'scripts/g0_queue_intensity.py'
      - 'scripts/test_g0_queue_intensity.py'
      - '.github/workflows/g0-queue-intensity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-intensity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official hftbacktest
        run: pip install hftbacktest==2.4.4
      - name: Verify isolated Poisson regression tests
        run: python -m unittest discover -s scripts -p 'test_g0_queue_intensity.py' -v
      - name: Inspect runner memory
        run: |
          free -h
          df -h .
      - name: Calibrate real OKX maker fills with active-order exposure
        run: python scripts/g0_queue_intensity.py --day 2026-11-01 --compare-10ms
      - name: Upload aggregate result without raw exchange data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-g0-queue-intensity-compare-2026-11-01
          path: reports/g0_queue_intensity_compare_2026-11-01.json
          retention-days: 14
          if-no-files-found: warn
