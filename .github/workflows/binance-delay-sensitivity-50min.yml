name: Binance delay sensitivity 50min paired GLFT pilot

on:
  push:
    paths:
      - '.github/workflows/binance-delay-sensitivity-50min.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delay-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        delay_ms: [1, 5, 10, 25, 50]
    env:
      DELAY_MS: ${{ matrix.delay_ms }}
      DAY: '2026-11-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official matching engine
        run: pip install hftbacktest==2.4.4
      - name: Check causal signal and event-engine regressions
        run: |
          python -m unittest discover -s scripts -p 'test_beta_one_direct_gap.py' -v
          python -m unittest discover -s scripts -p 'test_g0_glft_event_driven.py' -v
      - name: Replay identical OKX tape with paired beta0 beta1 at selected delay
        run: |
          python scripts/run_beta_one_direct_gap.py \
            --day "$DAY" --minutes 50 --extra-binance-delay-ms "$DELAY_MS"
      - name: Validate and summarize economics and order traffic
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          delay = int(os.environ["DELAY_MS"])
          date = os.environ["DAY"]
          path = Path(f"reports/beta_one_direct_gap_{date}_50m.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "complete"
          assert data["extra_binance_local_feed_delay_ms"] == delay
          assert data["warmup_minutes"] == 10 and data["trade_minutes"] == 50
          assert data["glft_5sec_calibration_trace_identical"]
          assert set(data["variants"]) == {"beta_0", "beta_1"}
          a, b = data["variants"]["beta_0"], data["variants"]["beta_1"]
          assert a["calibration_trace"] == b["calibration_trace"]
          assert a["samples"] == b["samples"]
          summary = []
          for label, v in (("beta_0", a), ("beta_1", b)):
              t = v["trading"]
              net = t["end_net_marked_equity_usdt"]
              fee = t["fee_usdt"]
              gross = net + fee
              summary.append((label, gross, fee, net,
                              t["engine_fills"], t["submissions"],
                              t["cancel_requests"], t["max_abs_position_contracts"]))
          diff = summary[1][3] - summary[0][3]
          assert abs(diff - data["paired_net_difference_beta1_minus_beta0_usdt"]) < 1e-8
          if delay == 25:
              assert abs(summary[0][3] - (-1.677219)) < 1e-5
              assert abs(summary[1][3] - (-1.419937)) < 1e-5
          print("DATE", date, "DELAY_MS", delay,
                "GAP_USABLE_FRACTION", data["gap_visibility_audit_100ms"]["usable_gap_fraction"])
          for row in summary:
              print("MODEL", row[0], "GROSS", row[1], "FEES", row[2],
                    "NET", row[3], "FILLS", row[4], "SUBMITS", row[5],
                    "CANCELS", row[6], "MAX_ABS_POSITION", row[7])
          print("PAIRED_NET_BETA1_MINUS_BETA0", diff)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"### {date} / extra Binance delay {delay}ms / 50min trade\n\n")
              f.write("| Model | Gross USDT | Fees USDT | Net USDT | Fills | Submits | Cancels |\n")
              f.write("|---|---:|---:|---:|---:|---:|---:|\n")
              for row in summary:
                  f.write(f"| {row[0]} | {row[1]:.6f} | {row[2]:.6f} | "
                          f"{row[3]:.6f} | {row[4]} | {row[5]} | {row[6]} |\n")
              f.write(f"\n**Paired beta1 − beta0 net:** {diff:+.6f} USDT; "
                      f"usable gap 100ms points: "
                      f"{data['gap_visibility_audit_100ms']['usable_gap_fraction']:.2%}\n")
          PY
      - name: Upload only aggregate JSON, never source market files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-delay-${{ matrix.delay_ms }}ms-2026-11-01-50min
          path: reports/beta_one_direct_gap_2026-11-01_50m.json
          if-no-files-found: warn
          retention-days: 14
