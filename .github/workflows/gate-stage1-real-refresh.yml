name: Gate BTC Stage1 real six-day Stage2 Stage5B total markout refresh
on:
  push:
    branches:
      - fix/gate-stage2-stage5b-total-markout-20261118
    paths:
      - .github/workflows/gate-stage1-real-refresh.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage2_day:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        day: ['2026-06-01','2026-07-01','2026-08-01','2026-09-01','2026-10-01','2026-11-01']
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Frozen official Gate BTC HBT fills and PnL
        uses: actions/download-artifact@v4
        with:
          run-id: 43786928308
          name: gate-btc-origin-90pct-full-day-${{ matrix.day }}
          github-token: ${{ github.token }}
          path: frozen_case
      - name: Real Tardis native Gate BTC quotes and Stage2 execution-price markout
        run: |
          python -u scripts/analyze_gate_1645_fill_quality.py \
            --mode day --day '${{ matrix.day }}' \
            --case-dir frozen_case \
            --out 'stage2_day/${{ matrix.day }}'
      - name: Preserve genuine newly annotated Stage2 official fills
        uses: actions/upload-artifact@v4
        with:
          name: gate-stage1-stage2-new-${{ matrix.day }}
          path: stage2_day/${{ matrix.day }}/
          if-no-files-found: error
          retention-days: 90

  stage2_stage5b_aggregate:
    needs: stage2_day
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Download all six genuine Stage2 revaluations from this run
        uses: actions/download-artifact@v4
        with:
          pattern: gate-stage1-stage2-new-*
          path: stage2_sixday
          merge-multiple: false
      - name: Independently average six Stage2 days
        run: |
          python scripts/analyze_gate_1645_fill_quality.py --mode aggregate \
            --input stage2_sixday \
            --out reports/gate_1645_stage2_total_markout_20261118
      - name: Download frozen Stage3 original GLFT threat-side classifications
        uses: actions/download-artifact@v4
        with:
          run-id: 43834100638
          pattern: gate-stage3-shadow-2026-*
          path: frozen_stage3
          merge-multiple: false
          github-token: ${{ github.token }}
      - name: Package genuine frozen Stage3 and new Stage2 same-fill arrays
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          days = [f'2026-{m:02d}-01' for m in range(6,12)]
          Path('stage5b_inputs').mkdir(exist_ok=True)
          Path('stage5b_stage2').mkdir(exist_ok=True)
          with ZipFile('stage5b_inputs/stage3_delivery.zip','w',compression=ZIP_STORED) as z:
              for day in days:
                  src = Path('frozen_stage3') / f'gate-stage3-shadow-{day}' / f'{day}_stage3_classified.npz'
                  if not src.is_file():
                      raise FileNotFoundError(src)
                  z.write(src, arcname=f'daily/{day}/{day}_stage3_classified.npz')
                  day_stage2 = Path('stage2_sixday') / f'gate-stage1-stage2-new-{day}' / f'{day}_glft_annotated.npz'
                  if not day_stage2.is_file():
                      raise FileNotFoundError(day_stage2)
                  with ZipFile(f'stage5b_stage2/gate_stage2_verified_{day[5:7]}.zip','w',compression=ZIP_STORED) as z2:
                      z2.write(day_stage2,arcname=f'{day}_glft_annotated.npz')
          print('FROZEN_CLASSIFICATIONS_AND_NEW_ANNOTATIONS_SIX_DAYS_OK')
          PY
      - name: Compute genuine Stage5B daily same-fill classes and paired-age analysis
        run: |
          python -u scripts/audit_gate_stage5b_same_fill.py \
            --stage3-zip stage5b_inputs/stage3_delivery.zip \
            --stage2-dir stage5b_stage2 \
            --stage4-json reports/gate_1645_stage4_controls/summary.json \
            --out reports/gate_1645_stage5b_total_markout_20261118
          python scripts/report_gate_stage2_stage5b_refresh.py \
            --stage2 reports/gate_1645_stage2_total_markout_20261118 \
            --stage5b reports/gate_1645_stage5b_total_markout_20261118 \
            --out reports/gate_1645_stage5b_total_markout_20261118/report.md
      - name: Audit all exact six-day models, categories and no invented depth metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('reports')
          s2=json.loads((base/'gate_1645_stage2_total_markout_20261118/summary.json').read_text())
          s5=json.loads((base/'gate_1645_stage5b_total_markout_20261118/summary.json').read_text())
          assert s2['status']=='complete' and s5['status']=='complete'
          assert len(s2['six_exploratory_dates'])==6 and len(s5['review_days'])==6
          for model in ('glft','both_1p0'):
              for h in ('100','500','1000'):
                  v=s2['results'][model]['all'][h]
                  assert v['valid_days']==6 and v['total_future_fresh_fills']>0
              for segment in s2['depth_visibility_comparison'][model].values():
                  assert segment['status']=='unavailable_missing_order_placement_l2_witness'
                  assert segment['orders_outside_visible_fraction'] is None
          for cat in ('threatened','inactive_or_no_effect','opposite'):
              for h in ('100','500','1000'):
                  v=s5['groups'][cat][h]
                  assert v['total_fresh_fills']>0
                  assert abs(v['total_markout_minus_maker2bps_bps']-v['total_markout_bps']+2)<1e-8
          print('REAL_SIX_DAY_STAGE2_STAGE5B_AUDIT_OK')
          PY
      - name: Upload read-only derived new six-day reports
        uses: actions/upload-artifact@v4
        with:
          name: gate-stage1-real-sixday-stage2-stage5b-20261118
          path: |
            reports/gate_1645_stage2_total_markout_20261118/
            reports/gate_1645_stage5b_total_markout_20261118/
          retention-days: 90
          if-no-files-found: error
      - name: Commit reports only to phase1 fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/gate_1645_stage2_total_markout_20261118/ reports/gate_1645_stage5b_total_markout_20261118/
          if ! git diff --cached --quiet; then
            git commit -m 'results: real six-day Stage2 and Stage5B execution-price total markout'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
