name: Tokyo L2 backtest input (fetch + narrowed qa_convert, one day x one Gate symbol)

# Read-only w.r.t. Drive and the QA state branch. Produces HBT NPZ as a run artifact only.
on:
  # workflow_dispatch is only offered once this file is on the default branch, so a push to
  # the experiment branch runs the default smoke case (2026-11-23, BTC_USDT).
  push:
    branches: [exp/tokyo-l2-glft]
    paths:
      - ".github/workflows/tokyo-l2-bt-convert.yml"
      - "scripts/tokyo_l2_bt_fetch.py"
      - "scripts/tokyo_l2_bt_convert.py"
      - "scripts/test_tokyo_l2_bt_convert.py"
  workflow_dispatch:
    inputs:
      date_utc:
        description: "Complete UTC day already passed by the 15m day QA (YYYY-MM-DD)"
        required: true
        type: string
      gate_symbol:
        description: "Gate contract, e.g. BTC_USDT (Binance leader BBO is derived)"
        required: true
        type: string
        default: "BTC_USDT"
      run_id:
        description: "Collection run_id (empty = taken from the day QA report)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tokyo-l2-bt-convert-${{ inputs.date_utc || '2026-11-23' }}-${{ inputs.gate_symbol || 'BTC_USDT' }}
  cancel-in-progress: false

env:
  # Frozen collector code = the commit the 15m QA checker ran (feat/tokyo-l2-reliability-fixes).
  COLLECTOR_SHA: 78f7a69ac070cdb1d823e93a871b0801c4a1e3b7
  COLLECTOR_CONFIG: source/collector/specs/config.trial_15m.json
  DATE_UTC: ${{ inputs.date_utc || '2026-11-23' }}
  GATE_SYMBOL: ${{ inputs.gate_symbol || 'BTC_USDT' }}
  RUN_ID: ${{ inputs.run_id || '' }}

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATE_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date_utc"; exit 2; }
          [[ "$GATE_SYMBOL" =~ ^[A-Z0-9]{1,20}_USDT$ ]] || { echo "::error::bad gate_symbol"; exit 2; }
          [[ -z "$RUN_ID" || "$RUN_ID" =~ ^[A-Za-z0-9_.:-]{1,80}$ ]] || { echo "::error::bad run_id"; exit 2; }

      - name: Check out backtest scripts
        uses: actions/checkout@v4
        with:
          path: workflow_code
          sparse-checkout: |
            scripts/tokyo_l2_bt_fetch.py
            scripts/tokyo_l2_bt_convert.py
            scripts/test_tokyo_l2_bt_convert.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out frozen collector code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COLLECTOR_SHA }}
          path: source
          sparse-checkout: |
            collector/python
            collector/specs
          persist-credentials: false

      - name: Check out day QA reports
        uses: actions/checkout@v4
        with:
          ref: tokyo-l2-qa-state
          path: state
          sparse-checkout: |
            qa_reports/days
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and unit-test the narrowing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install hftbacktest==2.4.4 numpy numba zstandard==0.23.0
          (cd workflow_code/scripts && python -m unittest test_tokyo_l2_bt_convert -v)
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          df -h "$RUNNER_TEMP" /

      - name: Configure read-only Google Drive access
        env:
          QA_SERVICE_ACCOUNT: ${{ secrets.TOKYO_L2_QA_GDRIVE_SA_JSON }}
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$QA_SERVICE_ACCOUNT" || -z "$QA_FOLDER_ID" ]]; then
            echo "::error::Missing TOKYO_L2_QA_GDRIVE_SA_JSON / TOKYO_L2_QA_GDRIVE_FOLDER_ID"; exit 2
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/tokyo-qa-auth"
          printf '%s' "$QA_SERVICE_ACCOUNT" > "$RUNNER_TEMP/tokyo-qa-auth/service-account.json"
          printf '[qa]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$RUNNER_TEMP/tokyo-qa-auth/service-account.json" "$QA_FOLDER_ID" \
            > "$RUNNER_TEMP/tokyo-qa-auth/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" rclone lsf qa:meta --max-depth 1 > /dev/null

      - name: Fetch verified day (integrity gate first)
        env:
          PYTHONPATH: source/collector/python:workflow_code/scripts
        shell: bash
        run: |
          set -euo pipefail
          python workflow_code/scripts/tokyo_l2_bt_fetch.py \
            --remote qa: --config "$COLLECTOR_CONFIG" --qa-days state/qa_reports/days \
            --date-utc "$DATE_UTC" --run-id "$RUN_ID" --gate-symbol "$GATE_SYMBOL" \
            --out "$RUNNER_TEMP/fetched" --workers 4
          du -sh "$RUNNER_TEMP/fetched"/raw/* || true
          df -h "$RUNNER_TEMP"

      - name: Narrowed qa_convert (unchanged converter)
        env:
          PYTHONPATH: source/collector/python:workflow_code/scripts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v python workflow_code/scripts/tokyo_l2_bt_convert.py \
            --fetched "$RUNNER_TEMP/fetched" --config "$COLLECTOR_CONFIG" \
            --date-utc "$DATE_UTC" --gate-symbol "$GATE_SYMBOL" --out "$RUNNER_TEMP/npz" \
            2> >(tee "$RUNNER_TEMP/time.txt" >&2)
          ls -la "$RUNNER_TEMP/npz"

      - name: Stage artifact (NPZ + reports only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bt_out
          cp "$RUNNER_TEMP/fetched/fetch_report.json" bt_out/ 2>/dev/null || true
          cp "$RUNNER_TEMP/time.txt" bt_out/ 2>/dev/null || true
          if [[ -d "$RUNNER_TEMP/npz" ]]; then
            find "$RUNNER_TEMP/npz" -maxdepth 1 -type f \( -name '*.npz' -o -name '*.json' \) -exec cp {} bt_out/ \;
          fi
          if find bt_out -type f \( -name '*.tsv.zst*' -o -name '*rclone.conf*' -o -name '*service-account*' \) | grep -q .; then
            echo "::error::refusing to upload raw data or credentials"; exit 2
          fi
          ls -la bt_out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-l2-bt-${{ env.DATE_UTC }}-${{ env.GATE_SYMBOL }}
          path: bt_out
          retention-days: 14
          if-no-files-found: warn

      - name: Remove credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/tokyo-qa-auth" "$RUNNER_TEMP/fetched"
