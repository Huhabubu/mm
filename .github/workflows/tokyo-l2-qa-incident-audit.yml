name: Tokyo L2 QA incident audit (read-only)

on:
  push:
    branches: [fix/tokyo-l2-qa-alert-audit-20261124]
    paths:
      - ".github/workflows/tokyo-l2-qa-incident-audit.yml"
      - "scripts/tokyo_l2_qa_incident_audit.py"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Collector QA ref providing the partition checker"
        required: false
        type: string
        default: "feat/tokyo-l2-reliability-fixes"

permissions:
  contents: read

concurrency:
  group: tokyo-l2-qa-incident-audit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only audit of archived QA incidents
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow_code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'feat/tokyo-l2-reliability-fixes' }}
          path: source
          persist-credentials: false
      - name: Read-only copy of persisted QA evidence
        uses: actions/checkout@v4
        with:
          ref: tokyo-l2-qa-state
          path: state
          persist-credentials: false
          sparse-checkout: |
            qa_reports/latest_run_summary.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install numpy zstandard==0.23.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Configure read-only Google Drive access
        env:
          QA_SERVICE_ACCOUNT: ${{ secrets.TOKYO_L2_QA_GDRIVE_SA_JSON }}
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/tokyo-qa-auth"
          printf '%s' "$QA_SERVICE_ACCOUNT" > "$RUNNER_TEMP/tokyo-qa-auth/service-account.json"
          printf '[qa]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$RUNNER_TEMP/tokyo-qa-auth/service-account.json" "$QA_FOLDER_ID" \
            > "$RUNNER_TEMP/tokyo-qa-auth/rclone.conf"
          echo "RCLONE_CONFIG=$RUNNER_TEMP/tokyo-qa-auth/rclone.conf" >> "$GITHUB_ENV"
      - name: Audit archived incidents
        shell: bash
        env:
          PYTHONPATH: source/collector/python:workflow_code/scripts
          QA_RUN_ID: ${{ vars.TOKYO_L2_QA_RUN_ID }}
          QA_SINCE_WINDOW: ${{ vars.TOKYO_L2_QA_SINCE_WINDOW }}
          QA_CONFIG_PATH: ${{ vars.TOKYO_L2_QA_CONFIG_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          {
            echo "workflow_code=$(git -C workflow_code rev-parse HEAD)"
            echo "source=$(git -C source rev-parse HEAD)"
            echo "state=$(git -C state rev-parse HEAD)"
          } | tee "$RUNNER_TEMP/audit/inputs.txt"
          python workflow_code/scripts/tokyo_l2_qa_incident_audit.py \
            --remote qa: --config "source/$QA_CONFIG_PATH" --run-id "$QA_RUN_ID" --cutover "$QA_SINCE_WINDOW" \
            --summary state/qa_reports/latest_run_summary.json --out "$RUNNER_TEMP/audit"
          cat "$RUNNER_TEMP/audit/incident_audit.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-l2-qa-incident-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: warn