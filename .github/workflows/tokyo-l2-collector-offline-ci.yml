name: Tokyo L2 Collector Offline CI

on:
  push:
    branches:
      - "feat/tokyo-l2-collector"
      - "feat/tokyo-l2-*"
      - "exp/**"
    paths:
      - "collector/**"
      - ".github/workflows/tokyo-l2-collector-offline-ci.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/tokyo-l2-collector-offline-ci.yml"
  workflow_dispatch:

jobs:
  offline-verification:
    name: Rust + Python Offline Protocol, Causal, Shutdown & Release Artifact (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      # Explicitly keep live WS execution disabled in CI
      TOKYO_L2_LIVE_AUTHORIZED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            collector/target
          key: ubuntu-24.04-cargo-collector-${{ hashFiles('collector/Cargo.toml', 'collector/Cargo.lock') }}

      - name: Run Rust unit, protocol, causal, storage & graceful-shutdown tests
        run: cargo test --manifest-path collector/Cargo.toml

      - name: Build release Rust collector binary (Ubuntu 24.04 x86_64)
        run: cargo build --release --manifest-path collector/Cargo.toml

      - name: Package & verify deployable EC2 release artifact
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/pkg
          cp collector/target/release/tokyo-l2-collector dist/pkg/tokyo-l2-collector
          chmod 755 dist/pkg/tokyo-l2-collector

          # Verify release binary runs offline preflight cleanly
          ./dist/pkg/tokyo-l2-collector preflight --config collector/specs/config.example.json --offline > /dev/null

          {
            echo "repo=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rustc=$(rustc --version)"
            echo "ldd=$(ldd --version | head -n 1)"
            echo "uname=$(uname -a)"
            echo "file=$(file dist/pkg/tokyo-l2-collector)"
          } > dist/pkg/BUILD_INFO.txt

          (cd dist/pkg && sha256sum tokyo-l2-collector > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp dist/pkg/tokyo-l2-collector dist/tokyo-l2-collector
          chmod 755 dist/tokyo-l2-collector
          cp dist/pkg/SHA256SUMS dist/SHA256SUMS
          cp dist/pkg/BUILD_INFO.txt dist/BUILD_INFO.txt

          tar -C dist/pkg -czf dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz \
            tokyo-l2-collector SHA256SUMS BUILD_INFO.txt
          (cd dist && sha256sum tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz > tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256)
          (cd dist && sha256sum -c SHA256SUMS && sha256sum -c tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256)
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS
          cat dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256

      - name: Upload deployable Ubuntu 24.04 x86_64 collector artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-l2-collector-ubuntu24.04-x86_64
          path: |
            dist/tokyo-l2-collector
            dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz
            dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256
            dist/SHA256SUMS
            dist/BUILD_INFO.txt
          retention-days: 30

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python dependencies (hftbacktest==2.4.4)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install hftbacktest==2.4.4 numpy numba zstandard pytest

      - name: Run Python offline E2E, anti-lookahead, 4-exchange, archive ledger & fault-injection tests
        run: .venv/bin/pytest -v collector/tests/

      - name: Run single-command offline preflight (Binance+Gate BTC MVP)
        run: ./collector/bin/preflight --config collector/specs/config.btc_gate_binance_mvp.json --offline

      - name: Run single-command offline preflight (Full 24-market panel)
        run: ./collector/bin/preflight --config collector/specs/config.example.json --offline

      - name: Run single-command offline preflight (15m trial panel)
        run: ./collector/bin/preflight --config collector/specs/config.trial_15m.json --offline

      - name: Verify live collect fails closed without explicit authorization
        run: |
          set +e
          OUT=$(./collector/bin/collect --config collector/specs/config.example.json --run-id ci_guard_test)
          RC=$?
          set -e
          echo "${OUT}"
          test "${RC}" -eq 3
          echo "${OUT}" | grep -q '"status": "blocked"'

      - name: Publish verified Ubuntu 24.04 binary to GitHub Prerelease
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/tokyo-l2-collector') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="collector-pre-${SHORT_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > dist/RELEASE_NOTES.md <<EOF
          Verified Ubuntu 24.04 x86_64 prebuilt release binary for \`tokyo-l2-collector\` (no Rust compilation required on EC2).

          - **Branch**: \`${GITHUB_REF_NAME}\`
          - **Commit**: \`${GITHUB_SHA}\`
          - **CI Run**: ${RUN_URL}
          - **Verification Gates Passed**: Rust unit/protocol/causal/storage/graceful-shutdown tests, Python E2E/anti-lookahead/archive/HBT 2.4.4 tests, offline preflight (24-market & MVP), and live-collect fail-closed guard.

          ### SHA-256 Checksums
          \`\`\`
          $(cat dist/SHA256SUMS)
          $(cat dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256)
          \`\`\`

          ### Build Info
          \`\`\`
          $(cat dist/BUILD_INFO.txt)
          \`\`\`
          EOF

          ASSETS=(
            dist/tokyo-l2-collector
            dist/SHA256SUMS
            dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz
            dist/tokyo-l2-collector-ubuntu24.04-x86_64.tar.gz.sha256
            dist/BUILD_INFO.txt
          )

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${ASSETS[@]}"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "tokyo-l2-collector Ubuntu 24.04 x86_64 (${SHORT_SHA})" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "tokyo-l2-collector Ubuntu 24.04 x86_64 (${SHORT_SHA})" \
              --notes-file dist/RELEASE_NOTES.md \
              "${ASSETS[@]}"
          fi
