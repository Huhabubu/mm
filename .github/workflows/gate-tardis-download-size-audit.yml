name: Tardis raw daily compressed archive size HEAD audit
on:
  push:
    branches:
      - experiment/gate-sol-doge-20261117
    paths:
      - .github/workflows/gate-tardis-download-size-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query actual Tardis CSV.GZ Content-Length without downloading archives
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote
          import json
          base='https://datasets.tardis.dev/v1'
          for coin in ('SOL','DOGE'):
              symbol=coin+'_USDT'
              paths=[f'gate-io-futures/{kind}/2026/06/01/{symbol}.csv.gz'
                     for kind in ('trades','incremental_book_L2','quotes')]
              paths+=[f'binance-futures/book_ticker/2026/06/01/{coin}USDT.csv.gz']
              total=0
              for path in paths:
                  req=Request(f'{base}/{path}',method='HEAD',
                              headers={'User-Agent':'mm-gate-tardis-daily-size-audit/1.0'})
                  try:
                      with urlopen(req,timeout=35) as resp:
                          n=resp.headers.get('Content-Length')
                          print('ARCHIVE_HEAD',coin,path,'http',resp.status,'bytes',n,flush=True)
                          if n: total+=int(n)
                  except (HTTPError,OSError) as e:
                      print('ARCHIVE_HEAD_ERROR',coin,path,repr(e),flush=True)
              print('ARCHIVE_TOTAL_KNOWN_BYTES',coin,total,flush=True)
          PY
