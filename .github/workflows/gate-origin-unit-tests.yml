name: Gate BTC GLFT weighted basis and origin state machine unit tests
on:
  push:
    paths:
      - '.github/workflows/gate-origin-unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'hftbacktest==2.4.4' numpy numba
      - name: Verify causal weighted moments and origin state logic
        run: python scripts/test_gate_origin_filter.py
      - name: Ensure the new module imports without touching old strategies
        run: python -m compileall -q scripts/gate_basis_weighted_moments.py scripts/gate_origin_glft_strategy.py scripts/run_gate_btc_origin_glft.py
