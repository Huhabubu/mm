name: Chapter5 coarse-tick unified post-only price-guard regression
on:
  push:
    branches: [exp/chapter5-robustness-cross-asset]
    paths: ['.github/workflows/chapter5-coarse-tick-fix-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Legacy coarse-tick unchanged, unified one-tick self-cross safety
        run: |
          PYTHONPATH=scripts python scripts/test_core_glft_rules.py
          PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
          PYTHONPATH=scripts python scripts/test_contract_specs.py
