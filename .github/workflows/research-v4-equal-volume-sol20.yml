name: Research V4 SOL 20min prior-trained integer Tick Equal-Volume G0
on:
  push:
    branches: [research/sparse-source-defense-20261114]
    paths: ['.github/workflows/research-v4-equal-volume-sol20.yml']
permissions:
  contents: write
  actions: read
jobs:
  may:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/sparse-source-defense-20261114}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install hftbacktest==2.4.4
      - name: 2026-05-01 only, original SOL 20min research G0 0-4 integer tick offsets
        run: |
          python scripts/experiment_source_defense_equal_volume_sol20.py \
            --mode train --out reports/source_defense/v4_equal_volume_SOL
      - uses: actions/upload-artifact@v4
        with:
          name: source-v4-sol20-equalvolume-may-frozen-choice
          path: reports/source_defense/v4_equal_volume_SOL/*.json
          if-no-files-found: error
  june:
    needs: may
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/sparse-source-defense-20261114}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install hftbacktest==2.4.4
      - uses: actions/download-artifact@v4
        with:
          name: source-v4-sol20-equalvolume-may-frozen-choice
          path: training
      - name: Replay frozen May integer ticks to June, validate vs official V4 same-window candidate
        run: |
          python scripts/experiment_source_defense_equal_volume_sol20.py \
            --mode test \
            --selection training/sol20_equal_volume_train.json \
            --target-summary reports/source_defense/v4_aggregate/v4_ablation_summary.json \
            --out reports/source_defense/v4_equal_volume_SOL
          cat reports/source_defense/v4_equal_volume_SOL/sol20_equal_volume_test.md \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Archive small May and June JSON MD only on research branch
        run: |
          cp training/sol20_equal_volume_train.json \
             reports/source_defense/v4_equal_volume_SOL/sol20_equal_volume_train.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/source_defense/v4_equal_volume_SOL/sol20_equal_volume_train.json \
                     reports/source_defense/v4_equal_volume_SOL/sol20_equal_volume_test.json \
                     reports/source_defense/v4_equal_volume_SOL/sol20_equal_volume_test.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(data): frozen May SOL20 integer G0 train and June exact fee/count validation'
          git pull --rebase origin research/sparse-source-defense-20261114
          git push origin HEAD:refs/heads/research/sparse-source-defense-20261114
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-v4-sol20-equalvolume-June-test
          path: reports/source_defense/v4_equal_volume_SOL/*
          if-no-files-found: warn
