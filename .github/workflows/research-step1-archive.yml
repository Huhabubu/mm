name: Research Step1 archive small verified text diagnostics into research branch
on:
  push:
    branches: [research/sparse-source-defense-20261114]
    paths: ['.github/workflows/research-step1-archive.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparse-source-defense-20261114
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 43548040042
          github-token: ${{ github.token }}
          name: sparse-defense-step1-readonly-buckets-added-inventory
          path: reports/source_defense/step1
      - name: Commit only small JSON/MD summary, never original NPZ or main
        run: |
          test -s reports/source_defense/step1/step1_diagnostics.json
          test -s reports/source_defense/step1/step1_diagnostics.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source_defense/step1/step1_diagnostics.json \
                  reports/source_defense/step1/step1_diagnostics.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research(data): archive verified June-1 Step1 G0 bps buckets and added inventory"
          git push origin HEAD:refs/heads/research/sparse-source-defense-20261114
