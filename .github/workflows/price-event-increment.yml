name: Binance price-event P1 vs P2 incremental prediction

on:
  push:
    paths:
      - ".github/workflows/price-event-increment.yml"
      - "scripts/predict_price_event_increment.py"
      - "scripts/test_predict_price_event_increment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-models:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed numerical dependency
        run: python -m pip install numpy==2.1.3
      - name: Run focused tests and existing regression suite
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check disk
        run: df -h .
      - name: Run same-event P1 vs P2 predictive test
        run: python scripts/predict_price_event_increment.py
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-binance-event-p1-p2-sixday-2026
          path: reports/price_event_p1_p2_native_bbo_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
