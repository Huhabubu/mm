name: CryptoHFTData Bybit Oct24 time-reversal details
on:
  push:
    branches:
      - research/chd-202610-sample-qa
    paths:
      - scripts/qa_chd_bybit_20261024_reversal.py
      - .github/workflows/chd-bybit-oct24-reversal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow
      - run: python scripts/qa_chd_bybit_20261024_reversal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chd-bybit-oct24-timestamp-diagnostic
          path: reports/chd_bybit_20261024_02_time_reversal.json
          retention-days: 45
