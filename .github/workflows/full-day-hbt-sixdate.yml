name: Six complete UTC days GLFT beta1 and local L2 peak official HBT

on:
  push:
    paths:
      - '.github/workflows/full-day-hbt-sixdate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-day:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        day: ['2026-06-01','2026-07-01','2026-08-01',
              '2026-09-01','2026-10-01','2026-11-01']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official hftbacktest 2.4.4
        run: pip install hftbacktest==2.4.4
      - name: Focused original and peak logic regressions
        run: |
          python -m unittest discover -s scripts -p 'test_g0_glft_event_driven.py' -v
          python -m unittest discover -s scripts -p 'test_glft_liquidity_wall.py' -v
      - name: Exact UTC 24h Tardis input, 10min warmup, 23h50 HBT trading
        run: |
          python -u scripts/run_beta_one_direct_gap.py --day ${{ matrix.day }} --minutes 1430 --extra-binance-delay-ms 25 --experiment wall_anchor --wall-search-ticks 50
      - name: Verify day-end coverage, identical estimator and fee-aware result
        if: success()
        run: |
          DAY="${{ matrix.day }}" python - <<'PY'
          from datetime import datetime, timezone, timedelta
          import json,os
          day=os.environ["DAY"]
          r=json.load(open(f"reports/glft_local_peak_{day}_1430m.json"))
          assert r["status"]=="complete" and r["full_utc_day_requested"]
          assert r["glft_5sec_calibration_trace_identical"]
          assert r["wall_anchor_method"]=="first_strict_local_usdt_notional_peak"
          end=(datetime.strptime(day,"%Y-%m-%d").replace(
              tzinfo=timezone.utc)+timedelta(days=1)).timestamp()*1e9
          for name in ("beta_0","beta_1","beta_0_wall","beta_1_wall"):
              v=r["variants"][name]
              shortfall=end-v["end_time_ns"]
              assert 0 <= shortfall <= 2e9, (day,name,"truncated",shortfall)
              assert v["samples"] >= 6000+1430*600-20, (day,name,"incomplete samples",v["samples"])
              t=v["trading"]
              assert t["engine_fills"]==t["buy_fills"]+t["sell_fills"]
              gross=t["end_net_marked_equity_usdt"]+t["fee_usdt"]
              print("DAILY",day,name,"GROSS",gross,"FEES",t["fee_usdt"],
                    "NET",t["end_net_marked_equity_usdt"],
                    "FILLS",t["engine_fills"],"CANCELS",t["cancel_requests"],
                    "SUBMISSIONS",t["submissions"],
                    "END_SHORTFALL_NS",int(shortfall),flush=True)
          PY
      - name: Upload per-day aggregates only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-day-${{ matrix.day }}-four-glft-models
          path: reports/glft_local_peak_${{ matrix.day }}_1430m.json
          if-no-files-found: warn
          retention-days: 14
