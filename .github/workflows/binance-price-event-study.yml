name: Binance native price-event OKX reaction study

on:
  push:
    paths:
      - ".github/workflows/binance-price-event-study.yml"
      - "scripts/binance_price_events.py"
      - "scripts/test_binance_price_events.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy
        run: python -m pip install numpy==2.1.3
      - name: Validate event order and causal label construction
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check runner disk budget
        run: df -h .
      - name: Run September to November native-BBO event study
        run: python scripts/binance_price_events.py --days 2026-09-01,2026-10-01,2026-11-01
      - name: Upload aggregated diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-price-event-okx-response-2026
          path: reports/binance_price_event_study_btc.json
          if-no-files-found: warn
          retention-days: 14
