name: Chapter5 final validated official 29-case aggregation and publication
on:
  push:
    branches: [exp/chapter5-robustness-cross-asset]
    paths: ['.github/workflows/chapter5-finalize.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chapter5-final-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/chapter5-robustness-cross-asset
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict aggregate accounting and UTC-vs-HBT-clock tests
        run: |
          python -m py_compile scripts/aggregate_chapter5_robustness.py
          PYTHONPATH=scripts python scripts/test_aggregate_chapter5_robustness.py
      - name: Download frozen BTC six days and first five 20-depth scenarios
        uses: actions/download-artifact@v4
        with:
          run-id: 44443409775
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          pattern: chapter5-case-BTC_USDT-*
          path: collected
      - name: Download all six repaired SOL DOGE ETH days; reject old failed alt candidates
        uses: actions/download-artifact@v4
        with:
          run-id: 44445139030
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          pattern: chapter5-fixed-case-*
          path: collected
      - name: Count exactly 29 independent real archived full-day JSONs
        run: |
          n=$(find collected -type f -name '*_1430m.json' | wc -l)
          echo "CHAPTER5_ARCHIVED_FULLDAY_JSON_COUNT=$n"
          test "$n" -eq 29
          for x in BTC_USDT SOL_USDT DOGE_USDT ETH_USDT; do
            find collected -type f -name '*_1430m.json' | grep "$x" | wc -l
          done
      - name: Strictly validate all 29 observed sessions and produce journal tables
        run: |
          python scripts/aggregate_chapter5_robustness.py \
            --root collected --out reports/chapter5_robustness_20261119
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/chapter5_robustness_20261119/summary.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='complete'
          assert d['complete_cases']==d['requested_cases']==29
          for sym in ('BTC_USDT','SOL_USDT','DOGE_USDT','ETH_USDT'):
              assert d['calibration'][sym]['valid_days']==6, sym
          for key in ('BTC_six_days','BTC_first5_20level','BTC_Nov1_400initial_plus_deltas','BTC_first5_cap20','SOL_six_days','DOGE_six_days','ETH_six_days_optional'):
              assert d['groups'][key]['all_requested_days_complete'],key
          print('CHAPTER5_ALL_29_INDEPENDENT_DAYS_VALIDATED')
          PY
      - name: Verify each of 29 source Run IDs, immutable JSON digests, and four-asset metric symmetry
        run: |
          python - <<'PY'
          import json, csv, math
          from collections import Counter
          from pathlib import Path
          root=Path('reports/chapter5_robustness_20261119')
          manifest=json.loads((root/'manifest.json').read_text())
          summary=json.loads((root/'summary.json').read_text())
          with (root/'per_day_models.csv').open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(manifest['cases'])==29
          assert len(summary['case_provenance'])==29
          assert len(rows)==82  # 24 base days * 3 + 5 depth-cap days * 2
          counts=Counter((c['run_id'],c['symbol'],c['case']) for c in manifest['cases'])
          assert sum(v for (r,s,c),v in counts.items() if r==44443409775)==11
          assert sum(v for (r,s,c),v in counts.items() if r==44445139030)==18
          assert all(len(c['json_sha256'])==64 for c in manifest['cases'])
          for row in rows:
              if row['status']!='complete':
                  raise ValueError(f"Incomplete daily row: {row}")
              assert row['source_run_id'] in ('44443409775','44445139030')
              assert len(row['source_json_sha256'])==64
              gross=float(row['gross_pnl_usdt'])
              fee=float(row['maker_fee_usdt'])
              net=float(row['net_pnl_usdt'])
              turnover=float(row['turnover_usdt'])
              assert abs(gross-fee-net)<1e-6
              assert abs(fee-0.0002*turnover)<1e-6
              assert abs(float(row['gross_pnl_turnover_bps'])-10000*gross/turnover)<1e-8
              assert abs(float(row['net_pnl_turnover_bps'])-10000*net/turnover)<1e-8
              for field in ('position_std_contracts','max_ops_per_sec',
                  'resting_bid_ratio','resting_ask_ratio',
                  'markout_100ms_bps','markout_100ms_future_quote_updated_bps',
                  'markout_500ms_bps','markout_1000ms_bps'):
                  assert row[field] and math.isfinite(float(row[field])),(field,row['symbol'])
          for group in ('BTC_six_days','SOL_six_days','DOGE_six_days','ETH_six_days_optional'):
              blob=summary['groups'][group]
              for model in ('glft','both_1p0','risk_side_pause'):
                  v=blob['model_stats'][model]
                  assert v['valid_days']==6
                  for field in ('gross_pnl_usdt','gross_pnl_turnover_bps','net_pnl_usdt',
                      'net_pnl_turnover_bps','turnover_usdt','position_std_contracts',
                      'max_ops_per_sec','resting_bid_ratio','resting_ask_ratio',
                      'markout_100ms_bps','markout_100ms_future_quote_updated_bps',
                      'markout_500ms_bps','markout_1000ms_bps'):
                      assert v[field] is not None,(group,model,field)
          print('CHAPTER5_FINAL_ALL_29_RUN_PROVENANCE_82_MODEL_DAYS_AND_LEDGER_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter5-final-29case-reports
          path: reports/chapter5_robustness_20261119/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit only new chapter5 results, preserving old manuscript baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/chapter5_robustness_20261119/summary.json reports/chapter5_robustness_20261119/report.md reports/chapter5_robustness_20261119/per_day_models.csv reports/chapter5_robustness_20261119/manifest.json
          git diff --cached --quiet || git commit -m 'results(ch5): verified 29 full-day BTC SOL DOGE ETH robustness cases'
          git pull --rebase origin exp/chapter5-robustness-cross-asset
          git push origin HEAD:exp/chapter5-robustness-cross-asset
          git log -1 --oneline
