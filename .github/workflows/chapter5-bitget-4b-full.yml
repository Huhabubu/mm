name: Bitget 4B official 24 full UTC asset days 4 symbols x 6 first-of-month (OKX FROZEN)
on:
  push:
    branches: [exp/chapter5-cross-exchange]
    paths:
      - '.github/workflows/chapter5-bitget-4b-full.yml'
      - 'scripts/run_bitget_core_glft.py'
      - 'scripts/bitget_4b_posthoc.py'
      - 'scripts/aggregate_bitget_4b_full.py'
      - 'scripts/test_bitget_4b_full.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bitget-4b-full-day-one-run
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Full-day syntax synthetic volume/quote/lot/fee accounting tests
        run: |
          python -m py_compile scripts/run_bitget_core_glft.py scripts/bitget_4b_posthoc.py scripts/aggregate_bitget_4b_full.py
          PYTHONPATH=scripts python scripts/test_bitget_4b_full.py
          PYTHONPATH=scripts python scripts/test_r1_core_defects.py
          PYTHONPATH=scripts python scripts/test_bitget_gate_qty_alignment.py
          PYTHONPATH=scripts python scripts/test_dual_grid_bitget.py
          PYTHONPATH=scripts python scripts/test_aggregate_cross_exchange_r1.py
  smoke:
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, DOGEUSDT]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Preserve accepted August 50m HBT economic and DOGE dual-grid behavior
        run: |
          PYTHONPATH=scripts python -u scripts/run_bitget_core_glft.py \
            --symbol '${{ matrix.symbol }}' --day 2026-08-01 --minutes 50 \
            --out smoke
          python - <<'PY'
          import json
          from pathlib import Path
          sym='${{ matrix.symbol }}'
          p=Path('smoke')/f'{sym}_2026-08-01_50m.json'
          d=json.loads(p.read_text())
          assert d['status']=='complete'
          assert len(d['models'])==3
          assert all(v['initial_fit_ns']==d['shared_first_eligible_entry_ns'] for v in d['models'].values())
          assert all(v['microsecond_collisions']>=0 for v in d['models'].values())
          print("BITGET_4B_PRE_FULL_SMOKE_OK",sym)
          PY
  full_day:
    needs: [offline,smoke]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, DOGEUSDT]
        day: ['2026-06-01','2026-07-01','2026-08-01','2026-09-01','2026-10-01','2026-11-01']
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Actual 1430min official HBT continuous replay using 60min segmented Tardis data
        run: |
          PYTHONPATH=scripts python -u scripts/run_bitget_core_glft.py \
            --symbol '${{ matrix.symbol }}' --day '${{ matrix.day }}' \
            --minutes 1430 --config configs/bitget_core_4b_smoke.json \
            --out 4b_day
      - name: Assert complete full UTC day, ledger, same fit and R1 statistics
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          from aggregate_bitget_4b_full import assert_report
          sym='${{ matrix.symbol }}'; day='${{ matrix.day }}'
          data=json.loads((Path("4b_day")/f"{sym}_{day}_1430m.json").read_text())
          assert_report(data,sym,day)
          print("BITGET_4B_REAL_FULL_DAY_PASS",sym,day,
                {m:(data['models'][m]['trading']['engine_fills'],
                    data['models'][m]['trading']['end_net_marked_equity_usdt'],
                    data['models'][m]['microsecond_collisions'],
                    data['models'][m]['binance_origin_filter']['same_timestamp_ties_blocked'])
                 for m in ('glft','both_1p0','risk_side_pause')})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitget-4b-day-${{ matrix.symbol }}-${{ matrix.day }}
          path: 4b_day/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: [offline,smoke,full_day]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: bitget-4b-day-*
          path: collected
      - name: Strict 24 asset-day, 72 model-day, identical-fit, ledger, three-slice audit
        run: |
          PYTHONPATH=scripts python -u scripts/aggregate_bitget_4b_full.py \
            --root collected --out reports/chapter5_bitget_4b_20261120 \
            --run-id '${{ github.run_id }}' --sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitget-4b-full-24-asset-day-archive
          path: reports/chapter5_bitget_4b_20261120/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only new 4B report artifacts, without modifying archived Gate or BTC files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/chapter5_bitget_4b_20261120/report.md \
            reports/chapter5_bitget_4b_20261120/summary.json \
            reports/chapter5_bitget_4b_20261120/per_day_models.csv \
            reports/chapter5_bitget_4b_20261120/qty_alignment.csv \
            reports/chapter5_bitget_4b_20261120/manifest.json
          git diff --cached --quiet || git commit -m "reports(4B): real Bitget 24 asset-day official HBT results and attribution"
          git pull --rebase origin exp/chapter5-cross-exchange
          git push origin HEAD:exp/chapter5-cross-exchange
      - name: Emit exact completed reference only after archive commit
        run: echo "BITGET_4B_24_DAY_ARCHIVED_RUN=${{ github.run_id }}"
