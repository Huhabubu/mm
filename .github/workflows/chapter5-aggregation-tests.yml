name: Chapter5 late aggregation contract tests
on:
  push:
    branches: [exp/chapter5-robustness-cross-asset]
    paths: ['.github/workflows/chapter5-aggregation-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and explicit missing-case / fee / shared-clock checks
        run: |
          python -m py_compile scripts/aggregate_chapter5_robustness.py
          PYTHONPATH=scripts python scripts/test_aggregate_chapter5_robustness.py
