name: BTC clock-shift placebo and quote cost-scale diagnostics

on:
  push:
    paths:
      - ".github/workflows/clock-shift-and-cost.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        day: ["2026-06-01", "2026-07-01", "2026-08-01", "2026-09-01", "2026-10-01", "2026-11-01"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy
        run: python -m pip install numpy==2.1.3
      - name: Run all focused event-order and fixed-grid tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run one-date frozen event clock shifts and OKX spread diagnostics
        run: python scripts/clock_shift_and_cost_scale.py --days ${{ matrix.day }}
      - name: Store aggregated JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-shift-cost-${{ matrix.day }}
          path: reports/btc_clock_shift_and_spread_scale_2026.json
          if-no-files-found: warn
          retention-days: 14
