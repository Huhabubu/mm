name: Research Step2 archive bps pilot Added and selective fee bridges
on:
  push:
    branches: [research/sparse-source-defense-20261114]
    paths: ['.github/workflows/research-step2-aggregate.yml']
permissions:
  contents: write
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparse-source-defense-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43548486905
          github-token: ${{ github.token }}
          pattern: sparse-defense-bps-*-2026-06-01
          path: gathered
          merge-multiple: false
      - name: Compare 11 modes for each coin using same official HBT matched fills
        run: |
          python scripts/experiment_source_defense_step2_aggregate.py \
            --source gathered --out reports/source_defense/step2_bps_summary
          cat reports/source_defense/step2_bps_summary/step2_bps_summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only small generated JSON and Markdown to isolated research branch
        run: |
          test -s reports/source_defense/step2_bps_summary/step2_bps_summary.json
          test -s reports/source_defense/step2_bps_summary/step2_bps_summary.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/source_defense/step2_bps_summary/step2_bps_summary.json \
            reports/source_defense/step2_bps_summary/step2_bps_summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(data): archive Step2 bps official HBT Added and selectivity audit'
          git pull --rebase origin research/sparse-source-defense-20261114
          git push origin HEAD:refs/heads/research/sparse-source-defense-20261114
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-defense-step2-bps-audit
          path: reports/source_defense/step2_bps_summary/*
          if-no-files-found: warn
          retention-days: 90
