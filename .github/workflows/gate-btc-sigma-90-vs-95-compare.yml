name: Compare Gate 90pct vs 95pct six full UTC days no-fee and VIP0
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read 1.645sigma six-day compact HBT results
        uses: actions/download-artifact@v4
        with:
          run-id: 43786928308
          pattern: gate-btc-origin-90pct-daily-json-*
          github-token: ${{ github.token }}
          path: new_threshold_daily_reports
          merge-multiple: false
      - name: Compare fee neutral and 0.02% Maker charges; verify baseline identity
        run: |
          python scripts/compare_gate_sigma_thresholds.py \
            --old reports/gate_origin_glft_full_day_aggregate/per_day_model.csv \
            --new new_threshold_daily_reports \
            --out reports/gate_sigma_1645_vs_196
      - name: Preserve paired 54-model CSV, JSON and Markdown
        uses: actions/upload-artifact@v4
        with:
          name: gate-btc-sigma-1645-vs-196-sixdays
          path: reports/gate_sigma_1645_vs_196/
          retention-days: 90
          if-no-files-found: error
      - name: Commit evidence on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/gate_sigma_1645_vs_196/
          if git diff --cached --quiet; then
            echo "Comparison identical to prior report"
          else
            git commit -m "results: compare Gate 1.645 vs 1.96 sigma with paired fee scenarios"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
