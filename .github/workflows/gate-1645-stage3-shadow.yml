name: Gate BTC sigma1645 stage3 full HBT shadow cancellation eligibility
on:
  push:
    branches:
      - analysis/gate-1645-pnl-stage1-20261116
    paths:
      - .github/workflows/gate-1645-stage3-shadow.yml
      - scripts/gate_stage3_shadow_strategy.py
      - scripts/audit_gate_1645_stage3_shadow.py
      - scripts/aggregate_gate_1645_stage3.py
      - scripts/test_audit_gate_1645_stage3_shadow.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  shadow:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-06-01','2026-07-01','2026-08-01','2026-09-01','2026-10-01','2026-11-01']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen 1.645sigma official HBT baseline and beta1
        uses: actions/download-artifact@v4
        with:
          run-id: 43786928308
          name: gate-btc-origin-90pct-full-day-${{ matrix.day }}
          github-token: ${{ github.token }}
          path: frozen
      - name: Download previously verified 100/500/1000ms native Gate markout
        uses: actions/download-artifact@v4
        with:
          run-id: 43828463022
          name: gate-stage2-quality-${{ matrix.day }}
          github-token: ${{ github.token }}
          path: annotated
      - name: Install original official matcher and basic diagnostic libraries
        run: pip install 'hftbacktest==2.4.4' numpy numba
      - name: Verify pre-fill deadline, category polarity, and 20ms gate
        run: |
          PYTHONPATH=scripts python scripts/test_audit_gate_1645_stage3_shadow.py
          PYTHONPATH=scripts python scripts/test_gate_origin_filter.py
      - name: Repeat complete frozen HBT and capture shadow states at pre-fill cancellation deadline
        run: |
          python -u scripts/audit_gate_1645_stage3_shadow.py \
            --day '${{ matrix.day }}' --frozen frozen --annotated annotated \
            --out 'stage3_daily/${{ matrix.day }}'
      - name: Preserve full-day exact-parity checks and fill-aligned categories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-stage3-shadow-${{ matrix.day }}
          path: stage3_daily/${{ matrix.day }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: shadow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Read all six completed exact-parity shadow traces
        uses: actions/download-artifact@v4
        with:
          pattern: gate-stage3-shadow-*
          path: stage3_sixday
          merge-multiple: false
      - name: Strict six-date aggregation and no-lookahead Markout group report
        run: |
          python scripts/aggregate_gate_1645_stage3.py \
            --input stage3_sixday \
            --out reports/gate_1645_stage3_shadow
      - name: Publish all six daily research summaries
        uses: actions/upload-artifact@v4
        with:
          name: gate-stage3-shadow-sixday-aggregate
          path: reports/gate_1645_stage3_shadow/
          if-no-files-found: error
          retention-days: 90
      - name: Commit evidence in isolated analysis branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/gate_1645_stage3_shadow/
          if ! git diff --cached --quiet; then
            git commit -m 'results: six day exact GLFT replay shadow signal markout analysis'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
