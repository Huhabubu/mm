name: Gate GLFT core 2A legacy behavior and contract units
on:
  push:
    branches:
      - feat/core-glft-engine-refactor
    paths:
      - '.github/workflows/gate-core-2a-regression.yml'
      - 'configs/contract_specs.json'
      - 'scripts/contract_specs.py'
      - 'scripts/qa_gate_btc_futures.py'
      - 'scripts/run_gate_btc_origin_glft.py'
      - 'scripts/core_glft_engine.py'
      - 'scripts/test_contract_specs.py'
      - 'scripts/test_core_glft_parity_replay.py'
      - 'scripts/instrument_gate_action_regression.py'
      - 'scripts/test_gate_altcoin_units.py'
      - 'scripts/gate_origin_glft_strategy.py'
      - 'scripts/gate_stage3_shadow_strategy.py'
      - 'scripts/gate_stage4_controls.py'
      - 'scripts/gate_stage5a_pause_strategy.py'
      - 'scripts/g0_glft_rolling.py'
      - 'scripts/core_glft_rules.py'
      - 'scripts/test_core_glft_physical_fit.py'
      - 'scripts/test_core_glft_rules.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Syntax integrity for new core and contract modules
        run: python -m py_compile scripts/contract_specs.py scripts/core_glft_engine.py scripts/test_core_glft_parity_replay.py scripts/qa_gate_btc_futures.py
      - name: Frozen units and fail-closed reference-contract tests
        run: PYTHONPATH=scripts python scripts/test_contract_specs.py
      - name: Legacy research units regression
        run: PYTHONPATH=scripts python scripts/test_gate_altcoin_units.py
      - name: New physical one-tick Poisson side-arrival estimator tests
        run: PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
      - name: Execution quote, clock and visible-depth rule tests
        run: PYTHONPATH=scripts python scripts/test_core_glft_rules.py
      - name: Stage4 and Stage5A existing offline regression
        run: |
          PYTHONPATH=scripts python scripts/test_gate_stage4_controls.py
          PYTHONPATH=scripts python scripts/test_gate_stage5a_pause.py
      - name: Historical GLFT 1.645 sigma gate and order-book normalization regression
        run: PYTHONPATH=scripts python scripts/test_gate_origin_filter.py
  real_gate_btc:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Compare original and extracted core on same historical Tardis Gate BTC 50min replay
        run: PYTHONPATH=scripts python -u scripts/test_core_glft_parity_replay.py --day 2026-11-01 --minutes 50 --trace-actions
