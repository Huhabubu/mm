name: Bitget Stage4A multiasset/offline report regression
on:
  push:
    branches: [exp/chapter5-cross-exchange]
    paths: ['.github/workflows/chapter5-bitget-4a-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All stage4A syntax and 24-case provenance/gap unit checks
        run: |
          python -m py_compile scripts/audit_bitget_multiasset_4a.py scripts/audit_bitget_btc_oct_lag_tail.py scripts/report_bitget_multiasset_4a.py
          PYTHONPATH=scripts python scripts/test_cross_exchange_4a.py
          PYTHONPATH=scripts python scripts/test_bitget_multiasset_4a.py
