name: Chapter5 3A BTC robustness and 3B SOL DOGE ETH official full-day HBT
on:
  push:
    branches: [exp/chapter5-robustness-cross-asset]
    paths: ['.github/workflows/chapter5-full-day.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chapter5-full-day-exp
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Verify five switches, same-day parity and result aggregation safety
        run: |
          PYTHONPATH=scripts python scripts/test_contract_specs.py
          PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
          PYTHONPATH=scripts python scripts/test_core_glft_rules.py
          PYTHONPATH=scripts python scripts/test_aggregate_chapter5_robustness.py
  replay:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {symbol: 'BTC_USDT', day: '2026-06-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-07-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-08-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-09-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-10-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-11-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-06-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-07-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-08-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-09-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-10-01', case: 'base'}
          - {symbol: 'SOL_USDT', day: '2026-11-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-06-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-07-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-08-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-09-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-10-01', case: 'base'}
          - {symbol: 'DOGE_USDT', day: '2026-11-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-06-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-07-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-08-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-09-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-10-01', case: 'base'}
          - {symbol: 'ETH_USDT', day: '2026-11-01', case: 'base'}
          - {symbol: 'BTC_USDT', day: '2026-06-01', case: 'cap'}
          - {symbol: 'BTC_USDT', day: '2026-07-01', case: 'cap'}
          - {symbol: 'BTC_USDT', day: '2026-08-01', case: 'cap'}
          - {symbol: 'BTC_USDT', day: '2026-09-01', case: 'cap'}
          - {symbol: 'BTC_USDT', day: '2026-10-01', case: 'cap'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Select frozen full-patch implementation and visible-depth mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('configs/core_glft_physical_robustness.json').read_text())
          assert config['min_requote_ns']==0
          assert config['fit_mode']=='physical_1tick_poisson'
          assert config['wait_book_after_fill'] is True
          assert config['post_only_clamp_mode']=='unified'
          assert config['cap_depth_at_visible_levels'] is False
          config['cap_depth_at_visible_levels']=('${{ matrix.case }}'=='cap')
          if config['cap_depth_at_visible_levels']:
              assert '${{ matrix.symbol }}'=='BTC_USDT' and '${{ matrix.day }}'<'2026-11-01'
          Path('/tmp/chapter5_case.json').write_text(json.dumps(config))
          PY
      - name: Full 1430-minute official Gate/Binance Tardis HBT (same first valid calibration for all models)
        run: |
          if [ '${{ matrix.case }}' = 'cap' ]; then
            MODELS='glft,both_1p0'
          else
            MODELS='glft,both_1p0,risk_side_pause'
          fi
          PYTHONPATH=scripts python -u scripts/run_gate_btc_origin_glft.py \
            --symbol '${{ matrix.symbol }}' \
            --day '${{ matrix.day }}' \
            --minutes 1430 \
            --models "$MODELS" \
            --core-config /tmp/chapter5_case.json \
            --out 'cases/${{ matrix.symbol }}/${{ matrix.case }}'
      - name: Preserve official per-day model result/QA and real executed fill trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-case-${{ matrix.symbol }}-${{ matrix.case }}-${{ matrix.day }}
          path: |
            cases/${{ matrix.symbol }}/${{ matrix.case }}/${{ matrix.day }}_1430m.json
            cases/${{ matrix.symbol }}/${{ matrix.case }}/recorder/${{ matrix.day }}/*/fills.npz
          if-no-files-found: warn
          retention-days: 90
  aggregate_and_publish:
    if: always()
    needs: [unit,replay]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/chapter5-robustness-cross-asset
          fetch-depth: 0
      - name: Download all actual per-day results including failed days
        uses: actions/download-artifact@v4
        with:
          pattern: chapter5-case-*
          path: collected
      - name: Fail-closed six-day and cross-asset audit / equal-day tables
        id: aggregate
        run: |
          set +e
          python scripts/aggregate_chapter5_robustness.py \
            --root collected \
            --out reports/chapter5_robustness_20261119
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve report, full day model CSV, and missing-day status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-robustness-20261119-report
          path: reports/chapter5_robustness_20261119/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit strictly new chapter5 report directory (frozen BTC baselines untouched)
        if: always()
        run: |
          if [ ! -f reports/chapter5_robustness_20261119/summary.json ]; then
            echo 'Chapter5 aggregation did not produce an auditable summary'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/chapter5_robustness_20261119
          git diff --cached --quiet || git commit -m 'results(ch5): official six-day BTC SOL DOGE ETH and depth-cap outcomes'
          git pull --rebase origin exp/chapter5-robustness-cross-asset
          git push origin HEAD:exp/chapter5-robustness-cross-asset
      - name: Enforce all 29 independent official full-day jobs complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/chapter5_robustness_20261119/summary.json')
          result=json.loads(p.read_text())
          assert result['requested_cases']==29
          assert result['complete_cases']==29, result['missing_or_failed_cases']
          assert result['status']=='complete'
          print('CHAPTER5_29_OFFICIAL_FULLDAY_CASES_ALL_COMPLETE')
          PY
