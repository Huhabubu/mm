name: Gate GLFT core 2B focused real-data smoke (not paper results)
on:
  push:
    branches:
      - feat/core-glft-engine-refactor
    paths:
      - '.github/workflows/gate-core-2b-smoke.yml'
      - 'scripts/core_glft_engine.py'
      - 'scripts/core_glft_rules.py'
      - 'scripts/g0_glft_rolling.py'
      - 'scripts/run_gate_btc_origin_glft.py'
      - 'scripts/contract_specs.py'
      - 'configs/core_glft_physical_robustness.json'
      - 'scripts/test_core_glft_rules.py'
      - 'scripts/test_core_glft_physical_fit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Five-switch unit primitives
        run: |
          PYTHONPATH=scripts python scripts/test_core_glft_rules.py
          PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
  hbt_50m_smoke:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Official HBT BTC 50min beta0 beta1 smoke; no historical paper result changes
        run: |
          PYTHONPATH=scripts python -u scripts/run_gate_btc_origin_glft.py \
            --day 2026-11-01 --minutes 50 --symbol BTC_USDT \
            --models glft,both_1p0 \
            --core-config configs/core_glft_physical_robustness.json \
            --out smoke_new_core
      - name: Verify real fills, fee-inclusive net, shared start and monitoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('smoke_new_core/2026-11-01_50m.json').read_text())
          assert r['status']=='complete'
          assert r['core_extension']
          assert r['shared_first_eligible_entry_ns'] is not None
          assert r['core_options']['min_requote_ns']==0
          assert r['core_options']['fit_mode']=='physical_1tick_poisson'
          assert r['core_options']['wait_book_after_fill'] is True
          for name in ('glft','both_1p0'):
              v=r['variants'][name]
              assert v['initial_fit_ns']==r['shared_first_eligible_entry_ns']
              assert v['max_ops_per_sec']>=0
              for side in ('bid','ask'):
                  ratio=v['resting_time_ratio'][side]
                  assert 0<=ratio<=1
              assert v['resting_time_ratio']['verified_exchange_resting'] is False
              assert 'end_net_marked_equity_usdt' in v['trading']
          print('CORE_2B_REAL_HBT_50MIN_SMOKE_OK',r['shared_first_eligible_entry_ns'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gate-core-2b-50min-smoke-not-for-paper
          path: smoke_new_core/2026-11-01_50m.json
          if-no-files-found: error
          retention-days: 30
