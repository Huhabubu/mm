name: CryptoHFTData Oct 2026 anomaly and manifest probe
on:
  push:
    branches:
      - research/chd-202610-sample-qa
    paths:
      - scripts/qa_chd_binance_20261015.py
      - scripts/qa_chd_head_probe.py
      - .github/workflows/chd-202610-probe-and-anomaly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/qa_chd_head_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chd-202610-head-probe
          path: reports/chd_head_probe.json
          retention-days: 30
  binance-anomaly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pyarrow numpy
      - name: Audit Binance trades NA and orderbook sequence
        run: python scripts/qa_chd_binance_20261015.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chd-binance-20261015-deep-audit
          path: reports/chd_binance_20261015_anomaly_audit.json
          retention-days: 30
