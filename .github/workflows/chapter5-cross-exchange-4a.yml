name: Chapter5 cross-exchange Stage4A official Tardis full-day data gate (NO HBT)
on:
  push:
    branches:
      - exp/chapter5-cross-exchange
    paths:
      - '.github/workflows/chapter5-cross-exchange-4a.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cross-exchange-4a
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and offline synthetic reference checks (not paper results)
        run: |
          python -m py_compile scripts/audit_cross_exchange_4a.py scripts/summarize_cross_exchange_4a.py
          PYTHONPATH=scripts python scripts/test_cross_exchange_4a.py
  scan:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {venue: 'bitget-futures', day: '2026-06-01'}
          - {venue: 'bitget-futures', day: '2026-07-01'}
          - {venue: 'bitget-futures', day: '2026-08-01'}
          - {venue: 'bitget-futures', day: '2026-09-01'}
          - {venue: 'bitget-futures', day: '2026-10-01'}
          - {venue: 'bitget-futures', day: '2026-11-01'}
          - {venue: 'okex-swap', day: '2026-09-01'}
          - {venue: 'okex-swap', day: '2026-10-01'}
          - {venue: 'okex-swap', day: '2026-11-01'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real Tardis four-feed full 24h stream, normalized L2/reconnect/lag/clock audit
        run: |
          PYTHONPATH=scripts python -u scripts/audit_cross_exchange_4a.py \
            --venue '${{ matrix.venue }}' --day '${{ matrix.day }}' \
            --config configs/cross_exchange_contract_specs_4a.json \
            --out 'data_gate/4a_${{ matrix.venue }}_${{ matrix.day }}.json'
      - name: Always retain actual per-day QA report (including failure reasons)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-4a-day-${{ matrix.venue }}-${{ matrix.day }}
          path: data_gate/4a_*.json
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: [offline,scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/chapter5-cross-exchange
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-4a-day-*
          path: collected
      - name: Aggregate actual nine date checks without filling missing days
        id: qa
        run: |
          set +e
          python scripts/summarize_cross_exchange_4a.py \
            --input collected \
            --out reports/chapter5_cross_exchange_4a_20261119
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Include frozen documented standard and research-comparison fee schedule
        if: always()
        run: |
          if [ -f reports/chapter5_cross_exchange_4a_20261119/summary.json ]; then
            cp configs/cross_exchange_contract_specs_4a.json \
              reports/chapter5_cross_exchange_4a_20261119/contract_specs_candidates.json
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/chapter5_cross_exchange_4a_20261119/summary.json')
          j=json.loads(p.read_text())
          j['source_runs']=[{'workflow_run_id':int('${{ github.run_id }}'),
                             'workflow_sha':'${{ github.sha }}',
                             'artifact_prefix':'cross-4a-day-'}]
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2,allow_nan=False)+'\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-exchange-4a-data-gate-9day-report
          path: reports/chapter5_cross_exchange_4a_20261119/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only new Stage4A report files, never touch old chapter5 results
        if: always()
        run: |
          if [ ! -f reports/chapter5_cross_exchange_4a_20261119/summary.json ]; then
            echo "No real CSV summary generated"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/chapter5_cross_exchange_4a_20261119/summary.json \
            reports/chapter5_cross_exchange_4a_20261119/report.md \
            reports/chapter5_cross_exchange_4a_20261119/per_day_gate.csv \
            reports/chapter5_cross_exchange_4a_20261119/contract_specs_candidates.json
          git diff --cached --quiet || git commit -m 'reports(4A): actual Tardis cross-exchange 9-day data/clock/reconstruction gate'
          git pull --rebase origin exp/chapter5-cross-exchange
          git push origin HEAD:exp/chapter5-cross-exchange
      - name: Explicit status: nine daily reports required
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/chapter5_cross_exchange_4a_20261119/summary.json')
          s=json.loads(p.read_text())
          assert s['days_with_json']==s['requested_days']==9
          assert s['no_backtest_performed'] is True
          print('CROSS_EXCHANGE_STAGE4A_NINE_REAL_DAILY_REPORTS_ARCHIVED')
          print('NORMALIZED_DATA_PASSED',s['venues'])
          print('NO_STAGE4B_LAUNCHED')
          PY
