name: Gate Stage2/Stage5B phase1 pure analysis regression
on:
  push:
    branches:
      - fix/gate-stage2-stage5b-total-markout-20261118
    paths:
      - 'scripts/analyze_gate_1645_fill_quality.py'
      - 'scripts/audit_gate_stage5b_same_fill.py'
      - 'scripts/test_analyze_gate_1645_fill_quality.py'
      - 'scripts/test_gate_stage2_stage5b_aggregate.py'
      - '.github/workflows/gate-stage2-stage5b-phase1-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile stage2 stage5b and tests
        run: python -m py_compile scripts/analyze_gate_1645_fill_quality.py scripts/audit_gate_stage5b_same_fill.py scripts/test_analyze_gate_1645_fill_quality.py scripts/test_gate_stage2_stage5b_aggregate.py
      - name: Stage2 and Stage5B deterministic offline tests
        run: PYTHONPATH=scripts python scripts/test_analyze_gate_1645_fill_quality.py
      - name: Six-day Stage2 aggregation and Stage5B ZIP fixture
        run: PYTHONPATH=scripts python scripts/test_gate_stage2_stage5b_aggregate.py
