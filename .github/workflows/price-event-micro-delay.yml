name: BTC micro-delay 0-10ms P1 P2 price-event prediction

on:
  push:
    paths:
      - ".github/workflows/price-event-micro-delay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-micro-delay:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed numerical dependency
        run: python -m pip install numpy==2.1.3
      - name: Verify source event ordering and micro-delay labels
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check temporary disk
        run: df -h .
      - name: Fit paired BTC models at 0 1 2 5 10ms extra delays and 5-100ms horizons
        run: python scripts/predict_price_event_increment.py --short-horizons --micro-delays
      - name: Upload aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-native-bbo-micro-delay-p1-p2-2026
          path: reports/price_event_p1_p2_native_bbo_short_micro_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
