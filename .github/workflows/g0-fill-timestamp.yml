name: G0 actual maker fill timestamp proof

on:
  push:
    paths:
      - 'scripts/test_g0_fill_timestamp.py'
      - '.github/workflows/g0-fill-timestamp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - name: Prove exchange fill timestamp in official matching engine
        run: python -m unittest discover -s scripts -p 'test_g0_fill_timestamp.py' -v
