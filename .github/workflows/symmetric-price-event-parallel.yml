name: Symmetric BTC price event response parallel cross-era check

on:
  push:
    paths:
      - ".github/workflows/symmetric-price-event-parallel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        date: ["2026-08-01", "2026-11-01"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy
        run: python -m pip install numpy==2.1.3
      - name: Run identical causal regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run symmetric event response for designated day
        run: python scripts/symmetric_price_event_response.py --days ${{ matrix.date }}
      - name: Upload only aggregate response metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symmetric-native-bbo-${{ matrix.date }}
          path: reports/btc_symmetric_price_event_response_2026_06_to_11.json
          retention-days: 14
          if-no-files-found: warn
