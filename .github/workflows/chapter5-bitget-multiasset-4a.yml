name: Stage4A Bitget ETH SOL DOGE six-day real Tardis gate and BTC Oct lag forensic (NO HBT)
on:
  push:
    branches: [exp/chapter5-cross-exchange]
    paths: ['.github/workflows/chapter5-bitget-multiasset-4a.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit source syntax plus BTC preexisting regression checks
        run: |
          python -m py_compile scripts/audit_cross_exchange_4a.py scripts/audit_bitget_multiasset_4a.py scripts/audit_bitget_btc_oct_lag_tail.py
          PYTHONPATH=scripts python scripts/test_cross_exchange_4a.py
          PYTHONPATH=scripts python scripts/test_cross_exchange_4a_report.py
  scan:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {symbol: 'ETHUSDT', day: '2026-06-01'}
          - {symbol: 'ETHUSDT', day: '2026-07-01'}
          - {symbol: 'ETHUSDT', day: '2026-08-01'}
          - {symbol: 'ETHUSDT', day: '2026-09-01'}
          - {symbol: 'ETHUSDT', day: '2026-10-01'}
          - {symbol: 'ETHUSDT', day: '2026-11-01'}
          - {symbol: 'SOLUSDT', day: '2026-06-01'}
          - {symbol: 'SOLUSDT', day: '2026-07-01'}
          - {symbol: 'SOLUSDT', day: '2026-08-01'}
          - {symbol: 'SOLUSDT', day: '2026-09-01'}
          - {symbol: 'SOLUSDT', day: '2026-10-01'}
          - {symbol: 'SOLUSDT', day: '2026-11-01'}
          - {symbol: 'DOGEUSDT', day: '2026-06-01'}
          - {symbol: 'DOGEUSDT', day: '2026-07-01'}
          - {symbol: 'DOGEUSDT', day: '2026-08-01'}
          - {symbol: 'DOGEUSDT', day: '2026-09-01'}
          - {symbol: 'DOGEUSDT', day: '2026-10-01'}
          - {symbol: 'DOGEUSDT', day: '2026-11-01'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read full 24h historical Bitget trades L2 quotes and same-symbol Binance book ticker
        run: |
          PYTHONPATH=scripts python -u scripts/audit_bitget_multiasset_4a.py \
            --symbol '${{ matrix.symbol }}' --day '${{ matrix.day }}' \
            --config configs/bitget_multiasset_contract_specs_4a.json \
            --out 'gate/4a_bitget-futures_${{ matrix.symbol }}_${{ matrix.day }}.json'
      - name: Archive audited asset day regardless of blocked/failed data gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-4a-${{ matrix.symbol }}-${{ matrix.day }}
          path: gate/4a_bitget-futures_*.json
          if-no-files-found: warn
          retention-days: 90
  btc_oct_tail:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-read entire October BTC Bitget quotes and Binance book ticker by UTC hour and 5-minute window
        run: |
          PYTHONPATH=scripts python -u scripts/audit_bitget_btc_oct_lag_tail.py \
            --out 'forensic/bitget_btc_oct_lag_tail.json'
      - name: Preserve full observed hourly and five-minute evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-4a-btc-2026-10-01-lag-tail
          path: forensic/bitget_btc_oct_lag_tail.json
          if-no-files-found: warn
          retention-days: 90
  end:
    needs: [offline,scan,btc_oct_tail]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Stage 4A only: full day artifacts kept on this run.'
          echo 'NO HBT trading, no OKX, no partial unverified results mixed into frozen reports.'
