name: CryptoHFTData Oct 2026 BTC four-venue sample QA
on:
  push:
    branches:
      - research/chd-202610-sample-qa
    paths:
      - scripts/qa_cryptohftdata_oct_2026.py
      - .github/workflows/chd-oct-2026-sample-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Verify venue-specific sequence rules
        run: python scripts/qa_cryptohftdata_oct_2026.py --self-test
      - name: Download and inspect BTC orderbooks and trades for October sample dates
        run: python scripts/qa_cryptohftdata_oct_2026.py
      - name: Archive summary JSON only (no raw market files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptohftdata-oct-2026-btc-four-venue-qa
          path: reports/chd_oct_2026_btc_sample_qa.json
          if-no-files-found: warn
          retention-days: 30
