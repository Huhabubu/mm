name: BTC cross-venue P1 P2 prediction pilot

on:
  push:
    paths:
      - ".github/workflows/prediction-pilot.yml"
      - "scripts/predict_leadlag.py"
      - "scripts/test_predict_leadlag.py"
      - "scripts/inspect_tardis.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical library
        run: python -m pip install numpy==2.1.3
      - name: Validate synthetic causal-alignment and regression cases
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Runner available disk
        run: df -h .
      - name: Download six separate Tardis dates and compare P1 vs P2
        run: python scripts/predict_leadlag.py --delays-ms 0,25,50,100
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-cross-venue-prediction-pilot-2026
          path: reports/prediction_pilot_btc_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
