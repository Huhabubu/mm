name: BTC cross-venue fixed-clock robustness

on:
  push:
    paths:
      - ".github/workflows/prediction-grid.yml"
      - "scripts/predict_leadlag.py"
      - "scripts/test_predict_leadlag.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy
        run: python -m pip install numpy==2.1.3
      - name: Run tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run P1 vs P2 on venue-independent fixed decision times
        run: python scripts/predict_leadlag.py --clock grid --delays-ms 0,25,50,100
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-cross-venue-fixed-clock-2026
          path: reports/prediction_pilot_btc_clock_grid_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
