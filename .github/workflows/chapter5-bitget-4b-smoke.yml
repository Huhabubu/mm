name: Bitget Stage4B adapter units dual tick Gate golden and two 50m HBT smokes (NO FULL DAY)
on:
  push:
    branches: [exp/chapter5-cross-exchange]
    paths:
      - '.github/workflows/chapter5-bitget-4b-smoke.yml'
      - 'scripts/core_glft_engine.py'
      - 'scripts/core_glft_rules.py'
      - 'scripts/run_bitget_core_glft.py'
      - 'scripts/test_dual_grid_bitget.py'
      - 'scripts/test_bitget_gate_qty_alignment.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Syntax and frozen Gate and physical GLFT unit tests
        run: |
          python -m py_compile scripts/core_glft_engine.py scripts/core_glft_rules.py \
            scripts/run_bitget_core_glft.py scripts/run_gate_btc_origin_glft.py \
            scripts/test_dual_grid_bitget.py scripts/test_bitget_gate_qty_alignment.py
          PYTHONPATH=scripts python scripts/test_dual_grid_bitget.py
          PYTHONPATH=scripts python scripts/test_bitget_gate_qty_alignment.py
          PYTHONPATH=scripts python scripts/test_core_glft_rules.py
          PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
          PYTHONPATH=scripts python scripts/test_contract_specs.py
          PYTHONPATH=scripts python scripts/test_gate_altcoin_units.py
  smoke:
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        symbol: ['BTCUSDT','DOGEUSDT']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Real Bitget and Binance August-01 10m train plus 50m trading with official HBT
        run: |
          PYTHONPATH=scripts python -u scripts/run_bitget_core_glft.py \
            --symbol '${{ matrix.symbol }}' --day 2026-08-01 --minutes 50 \
            --config configs/bitget_core_4b_smoke.json \
            --out bitget_4b_smoke
      - name: Verify shared actual initial fit fee identity legal prices and unsnapped DOGE input
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          sym='${{ matrix.symbol }}'
          path=Path(f'bitget_4b_smoke/{sym}_2026-08-01_50m.json')
          data=json.loads(path.read_text())
          assert data['status']=='complete',data.get('error')
          assert data['venue']=='bitget-futures'
          assert data['quote_tick_mult']==(10 if sym=='DOGEUSDT' else 1)
          assert data['simulated_maker_fee_rate']==0.0002
          assert data['gate_base_quantity_reference']['strict_base_amount_equal'] is True
          if sym=='DOGEUSDT':
              assert data['hbt_raw_price_tick']==1e-6
              assert data['legal_order_quote_tick']==1e-5
              assert data['lossless_raw_L2_check']['off_legal_quote_grid_rows']>0
              assert data['lossless_raw_L2_check']['l2_post_message_book_checks']>0
              assert data['lossless_raw_L2_check']['l2_crossed_post_message_book_checks']==0
          start=data['shared_first_eligible_entry_ns']
          assert isinstance(start,int) and start>0
          for name in ('glft','both_1p0','risk_side_pause'):
              m=data['models'][name]
              assert m['initial_fit_ns']==start
              assert m['successful_calibrations']>0
              t=m['trading']
              fee,turnover=t['fee_usdt'],t['trading_value_usdt']
              assert abs(fee-0.0002*turnover)<1e-6
              assert abs(t['gross_marked_pnl_usdt']-fee-t['end_net_marked_equity_usdt'])<1e-6
              assert t['engine_fills']==t['buy_fills']+t['sell_fills']
              assert t['max_abs_position_base']<=data['scenario']['position_cap']+data['scenario']['qty']+1e-9
              assert m['max_ops_per_sec']>=0
              for side in ('bid','ask'):
                  assert 0<=m['resting_time_ratio'][side]<=1
              assert m['resting_time_ratio']['verified_exchange_resting']==False
              for horizon in ('100','500','1000'):
                  assert horizon in m['quote_quality']['groups']['all']['horizons']
          print('BITGET_4B_REAL_SMOKE_50MIN_PASS',sym,start,{
               n:(data['models'][n]['trading']['engine_fills'],
                  data['models'][n]['trading']['end_net_marked_equity_usdt'])
               for n in ('glft','both_1p0','risk_side_pause')})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitget-4b-smoke-${{ matrix.symbol }}-2026-08-01-50m
          path: bitget_4b_smoke/
          if-no-files-found: warn
          retention-days: 90
  gate_golden:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Frozen Gate historical HBT requests and PnL exact parity with multiplier default 1
        run: |
          PYTHONPATH=scripts python -u scripts/test_core_glft_parity_replay.py \
            --day 2026-11-01 --minutes 50 --trace-actions
