name: Four-market GLFT 6date 50min with native Recorder
on:
  push:
    paths:
      - '.github/workflows/four-market-recorder-sixdate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multivenue-50min:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ['2026-06-01','2026-07-01','2026-08-01','2026-09-01','2026-10-01','2026-11-01']
        market:
          - exchange: okx
            coin: BTC
          - exchange: okx
            coin: SOL
          - exchange: bitget
            coin: BTC
          - exchange: bitget
            coin: SOL
    env:
      DAY: ${{ matrix.day }}
      VENUE: ${{ matrix.market.exchange }}
      COIN: ${{ matrix.market.coin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official HBT engine
        run: pip install hftbacktest==2.4.4
      - name: Unit checks for cross-market contract and gamma equivalence
        run: |
          python -m unittest discover -s scripts -p 'test_multivenue_glft.py' -v
          python -m unittest discover -s scripts -p 'test_beta_one_direct_gap.py' -v
      - name: Official HBT GLFT + Binance + local peak 10min warmup 50min trade
        run: |
          python scripts/run_multivenue_glft.py --day "$DAY" \
            --exchange "$VENUE" --coin "$COIN" \
            --minutes 50 --extra-binance-delay-ms 25
      - name: Verify time-series Recorder and paired economics, or report non-identifiability
        run: |
          python - <<'PY'
          import json,os,numpy as np
          day,venue,coin=os.environ["DAY"],os.environ["VENUE"],os.environ["COIN"]
          obj=json.load(open(f"reports/{venue}_{coin}_{day}_50m.json",encoding="utf-8"))
          print("CASE",day,venue,coin,"STATUS",obj["status"])
          if obj["status"]=="no_glft_calibration":
              diag=obj["calibration_diagnostic"]
              assert not diag["valid"]
              print("CALIBRATION_UNAVAILABLE",day,venue,coin,diag)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write(f"**{day} {venue} {coin}: no GLFT calibration** "
                          f"(positive levels: {diag['positive_levels']}, "
                          f"100ms crossing intervals: {diag['crossing_100ms_intervals']}).\n")
              raise SystemExit(0)
          assert obj["status"]=="complete"
          assert len(obj["variants"])==4
          variants=obj["variants"]
          ref=variants["glft"]
          for name,item in variants.items():
              assert item["calibration_trace"]==ref["calibration_trace"]
              t=item["trading"]
              record=item["recorder"]
              with np.load(record["file"]) as z:
                  assert len(z["0"])==record["samples"]
                  assert len(z["0"])>=29000
                  assert np.isfinite(z["0"]["price"]).all()
              with np.load(record["fill_file"]) as z:
                  assert len(z["exec_qty"])==t["engine_fills"]
              gross=t["end_net_marked_equity_usdt"]+t["fee_usdt"]
              print("RESULT",day,venue,coin,name,"GROSS",gross,
                    "FEE",t["fee_usdt"],"NET",t["end_net_marked_equity_usdt"],
                    "FILLS",t["engine_fills"],"CANCEL",t["cancel_requests"],
                    "RECORDER_SAMPLES",record["samples"])
          b=variants["glft"]["trading"]["end_net_marked_equity_usdt"]
          guided=variants["glft_binance"]["trading"]["end_net_marked_equity_usdt"]
          print("DELTA_NET_BINANCE_MINUS_GLFT",day,venue,coin,guided-b)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write(f"**{day} {venue} {coin}:** GLFT {b:+.6f}, "
                      f"Binance {guided:+.6f}, delta {guided-b:+.6f} USDT / 50min.\n")
          PY
      - name: Preserve Recorder 100ms timeseries and maker fills (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-${{ matrix.market.exchange }}-${{ matrix.market.coin }}-${{ matrix.day }}-50min
          path: |
            reports/${{ matrix.market.exchange }}_${{ matrix.market.coin }}_${{ matrix.day }}_50m.json
            reports/recorder/${{ matrix.market.exchange }}_${{ matrix.market.coin }}_${{ matrix.day }}_50m/*.npz
          if-no-files-found: warn
          retention-days: 90
