name: Binance native price-event OKX reaction study early months

on:
  push:
    paths:
      - ".github/workflows/binance-price-event-study-early.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy
        run: python -m pip install numpy==2.1.3
      - name: Run focused synthetic regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Analyze earlier native-BBO days
        run: python scripts/binance_price_events.py --days 2026-06-01,2026-07-01,2026-08-01
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-price-event-okx-response-early-2026
          path: reports/binance_price_event_study_btc.json
          if-no-files-found: warn
          retention-days: 14
