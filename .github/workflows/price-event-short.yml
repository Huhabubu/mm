name: BTC short 5-100ms price-event P1 P2 prediction

on:
  push:
    paths:
      - ".github/workflows/price-event-short.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-short:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numpy
        run: python -m pip install numpy==2.1.3
      - name: Check causal alignment and 5-100ms sparse-label regressions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run unchanged P1/P2 with 5/10/20/50/100ms horizons
        run: python scripts/predict_price_event_increment.py --short-horizons
      - name: Save only aggregate quote-update, model and validation statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-price-event-5-100ms-p1-p2
          path: reports/price_event_p1_p2_native_bbo_short_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
