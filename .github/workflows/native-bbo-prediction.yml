name: P1 P2 on native BBO (book_ticker)

on:
  push:
    paths:
      - ".github/workflows/native-bbo-prediction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        clock: [binance, grid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy
        run: python -m pip install numpy==2.1.3
      # Includes regression for same-microsecond native Binance events.
      - name: Test causal as-of construction and QA
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Log disk available
        run: df -h .
      - name: Run native book_ticker P1 vs P2
        run: python scripts/predict_leadlag.py --data-kind book_ticker --clock ${{ matrix.clock }} --delays-ms 0,25,50,100
      - name: Upload aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-bbo-prediction-${{ matrix.clock }}-2026
          path: reports/prediction_pilot_btc_clock_${{ matrix.clock }}_book_ticker_2026-06_to_11.json
          if-no-files-found: warn
          retention-days: 14
