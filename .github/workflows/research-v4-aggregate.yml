name: Research V4 three-coin pure ablation aggregate and archive
on:
  push:
    branches: [research/sparse-source-defense-20261114]
    paths: ['.github/workflows/research-v4-aggregate.yml']
permissions:
  contents: write
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparse-source-defense-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - uses: actions/download-artifact@v4
        with:
          run-id: 43552330145
          github-token: ${{ github.token }}
          pattern: source-defense-v4-*-june-2026
          path: previous_pilot
          merge-multiple: false
      - name: Summarize official net PnL, Added Dropped Kept, P10 and paired filter effects
        run: |
          python scripts/experiment_source_defense_v4_aggregate.py \
            --source previous_pilot --out reports/source_defense/v4_aggregate
          cat reports/source_defense/v4_aggregate/v4_ablation_summary.md \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Commit compact JSON MD only, not huge fill NPZ
        run: |
          test -s reports/source_defense/v4_aggregate/v4_ablation_summary.json
          test -s reports/source_defense/v4_aggregate/v4_ablation_summary.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/source_defense/v4_aggregate/v4_ablation_summary.json \
                     reports/source_defense/v4_aggregate/v4_ablation_summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(data): archive V4 3coin emergency and microstructure ablation results'
          git pull --rebase origin research/sparse-source-defense-20261114
          git push origin HEAD:refs/heads/research/sparse-source-defense-20261114
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-v4-three-coin-net-and-selection-aggregate
          path: reports/source_defense/v4_aggregate/*
          if-no-files-found: error
          retention-days: 90
