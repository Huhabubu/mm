name: Tokyo L2 Kaggle job (update + run existing private notebook, fetch log and outputs)

# Job spec = kaggle/job.json on this branch. A push that changes kaggle/** launches it.
# GitHub never touches Drive here; Drive access happens on Kaggle via the notebook's
# own attached User Secrets. Outputs come back as a private run artifact.
on:
  push:
    branches: [exp/tokyo-l2-glft]
    paths:
      - "kaggle/**"
      - ".github/workflows/tokyo-l2-kaggle.yml"

permissions:
  contents: read

concurrency:
  group: tokyo-l2-kaggle
  cancel-in-progress: false

env:
  COLLECTOR_SHA: 78f7a69ac070cdb1d823e93a871b0801c4a1e3b7
  NOTEBOOK_NAME: tokyo-l2-glft
  # Private dataset with the read-only Drive credential files. API-pushed runs get HTTP 400 from
  # Kaggle User Secrets (runs 45351173905 / 45351933573; kaggle-cli issue #582), so the notebook
  # mounts this dataset under /kaggle/input instead.
  CRED_DATASET_NAME: tokyo-l2-gdrive-cred

jobs:
  kaggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          path: workflow_code
          persist-credentials: false

      - name: Check out frozen collector code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COLLECTOR_SHA }}
          path: source
          sparse-checkout: |
            collector/python
            collector/specs
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          # current kaggle wheel imports `six` without declaring it (run 45345321894)
          python -m pip install -q -U kaggle six
          python -m pip show kaggle | sed -n '1,2p'
          kaggle --version

      - name: Configure Kaggle auth (token never printed)
        env:
          KAGGLE_SECRET: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_SECRET" ]] || { echo "::error::KAGGLE_API_TOKEN secret missing"; exit 2; }
          umask 077
          mkdir -p ~/.kaggle
          if [[ "$KAGGLE_SECRET" == \{* ]]; then
            printf '%s' "$KAGGLE_SECRET" > ~/.kaggle/kaggle.json
            echo "auth_mode=kaggle.json"
          else
            printf '%s' "$KAGGLE_SECRET" > ~/.kaggle/access_token
            echo "KAGGLE_API_TOKEN=$KAGGLE_SECRET" >> "$GITHUB_ENV"
            echo "auth_mode=api_token"
          fi

      - name: Resolve existing notebook
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --mine --csv --page-size 100 > "$RUNNER_TEMP/kernels.csv"
          SLUG="$(python - "$RUNNER_TEMP/kernels.csv" <<'PY'
          import csv, os, sys
          rows = list(csv.DictReader(open(sys.argv[1], encoding="utf-8")))
          hits = [r["ref"].strip("/") for r in rows if r.get("ref", "").rstrip("/").split("/")[-1] == os.environ["NOTEBOOK_NAME"]]
          if len(hits) != 1:
              sys.exit(f"expected exactly one existing notebook named {os.environ['NOTEBOOK_NAME']}, found {len(hits)}")
          print(hits[0].removeprefix("code/"))
          PY
          )"
          echo "KAGGLE_SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "notebook=$SLUG"
          kaggle kernels status "$SLUG" || true

      - name: Ensure private credential dataset (create once, never re-upload, never public)
        env:
          # Dedicated read-only backtest service account, not the QA workflow's account.
          QA_SERVICE_ACCOUNT: ${{ secrets.TOKYO_L2_BT_GDRIVE_SA_JSON }}
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          CRED_DATASET="${KAGGLE_SLUG%%/*}/$CRED_DATASET_NAME"
          echo "CRED_DATASET=$CRED_DATASET" >> "$GITHUB_ENV"
          if kaggle datasets files "$CRED_DATASET" >/dev/null 2>&1; then
            echo "credential dataset exists: $CRED_DATASET (not re-uploaded)"
          else
            [[ -n "$QA_SERVICE_ACCOUNT" && -n "$QA_FOLDER_ID" ]] || { echo "::error::Drive secrets missing"; exit 2; }
            umask 077
            d="$RUNNER_TEMP/cred_ds"; rm -rf "$d"; mkdir -p "$d"
            trap 'rm -rf "$d"' EXIT
            printf '%s' "$QA_SERVICE_ACCOUNT" > "$d/tokyo_l2_gdrive_sa.json"
            printf '%s' "$QA_FOLDER_ID" > "$d/tokyo_l2_gdrive_folder_id.txt"
            python - "$d" "$CRED_DATASET" <<'PY'
          import json, sys, pathlib
          d, ref = pathlib.Path(sys.argv[1]), sys.argv[2]
          sa = json.loads((d / "tokyo_l2_gdrive_sa.json").read_text())
          assert sa.get("type") == "service_account", "not a service-account JSON"
          (d / "dataset-metadata.json").write_text(json.dumps(
              {"title": ref.split("/")[1], "id": ref, "licenses": [{"name": "other"}]}))
          print("credential files staged (values not printed)")
          PY
            # No --public flag: Kaggle creates datasets private by default.
            kaggle datasets create -p "$d" -q 2>&1 | tail -n 3
          fi
          s=""
          for i in $(seq 1 30); do
            s="$(kaggle datasets status "$CRED_DATASET" 2>&1 | tr 'A-Z' 'a-z' || true)"
            echo "dataset status: $s"
            [[ "$s" == *ready* ]] && break
            sleep 10
          done
          [[ "$s" == *ready* ]] || { echo "::error::credential dataset not ready"; exit 2; }
          python - "$CRED_DATASET" <<'PY'
          import sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          owner, slug = sys.argv[1].split("/")
          hits = [d for d in api.dataset_list(mine=True, search=slug) if str(getattr(d, "ref", "")).endswith("/" + slug)]
          priv = [getattr(d, "is_private", getattr(d, "isPrivate", None)) for d in hits]
          print("credential dataset privacy:", priv)
          if len(priv) != 1 or priv[0] is not True:
              sys.exit(f"cannot confirm credential dataset is PRIVATE (got {priv!r}) - refusing to continue")
          PY

      - name: Check out QA day reports (read-only)
        uses: actions/checkout@v4
        with:
          ref: tokyo-l2-qa-state
          path: qa_state
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qa_reports/days/
            /qa_reports/protocol/*/15m/2026-11-23T*.json
            /qa_reports/windows/*/2026-11-23/*.window.qa.json
          persist-credentials: false

      - name: Check out current protocol QA rules (read-only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: qa_rules/workflow_code
          sparse-checkout: |
            scripts/tokyo_l2_protocol_qa.py
            scripts/tokyo_l2_replay_qa.py
            scripts/tokyo_l2_recurring_qa.py
          persist-credentials: false

      - name: Stage QA day reports listed in kaggle/job.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, shutil, subprocess
          job = json.load(open("workflow_code/kaggle/job.json"))
          src = pathlib.Path("qa_state/qa_reports/days")
          dst = pathlib.Path("workflow_code/kaggle/qa_days")
          for d in job.get("qa_days_dates", []):
              hits = sorted(src.glob(f"*/{d}_p15m.day.qa.json"))
              if len(hits) != 1:
                  raise SystemExit(f"need exactly one 15m QA day report for {d}, found {[str(h) for h in hits]}")
              out = dst / hits[0].parent.name / hits[0].name
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(hits[0], out)
              print("staged", out)
          protocol_dst = pathlib.Path("workflow_code/kaggle/qa_protocol")
          protocol_dst.mkdir(parents=True, exist_ok=True)
          qa_sha = subprocess.check_output(["git", "-C", "qa_state", "rev-parse", "HEAD"], text=True).strip()
          qa_rules_sha = subprocess.check_output(["git", "-C", "qa_rules/workflow_code", "rev-parse", "HEAD"], text=True).strip()
          rules_digest = subprocess.check_output(
              ["bash", "-c", "cd qa_rules && sha256sum workflow_code/scripts/tokyo_l2_{protocol,replay,recurring}_qa.py | sha256sum | cut -d ' ' -f1"],
              text=True,
          ).strip()
          provenance = {
              "qa_state_sha": qa_sha,
              "qa_rules_main_sha": qa_rules_sha,
              "expected_protocol_rules_sha": rules_digest,
              "window_archive_revisions": {},
              "protocol_files": [],
              "missing_protocol_windows": [],
          }
          proto_windows = list(job.get("qa_protocol_windows", []))
          proto_date = job.get("qa_protocol_date")
          if proto_date and not proto_windows:
              proto_windows = [f"{proto_date}T{h:02d}{m:02d}Z" for h in range(24) for m in (0, 15, 30, 45)]
          for window in proto_windows:
              d_part = window.split("T")[0]
              whits = sorted(pathlib.Path("qa_state/qa_reports/windows").glob(f"*/{d_part}/{window}__*.window.qa.json"))
              if len(whits) == 1:
                  wdata = json.loads(whits[0].read_text())
                  if wdata.get("window_id") and wdata.get("archive_revision"):
                      provenance["window_archive_revisions"][wdata["window_id"]] = wdata["archive_revision"]
              hits = sorted(pathlib.Path("qa_state/qa_reports/protocol").glob(f"*/15m/{window}.json"))
              if len(hits) != 1:
                  provenance["missing_protocol_windows"].append(window)
                  continue
              shutil.copy2(hits[0], protocol_dst / hits[0].name)
              provenance["protocol_files"].append(str(hits[0].relative_to("qa_state")))
          (protocol_dst / "provenance.json").write_text(json.dumps(provenance, indent=2))
          print("qa provenance summary", json.dumps({
              "qa_state_sha": qa_sha, "qa_rules_main_sha": qa_rules_sha,
              "expected_protocol_rules_sha": rules_digest,
              "protocol_files_count": len(provenance["protocol_files"]),
              "window_revisions_count": len(provenance["window_archive_revisions"]),
              "missing_protocol_windows": provenance["missing_protocol_windows"],
          }))
          PY

      - name: Build new notebook version from kaggle/job.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nb"
          kaggle kernels pull "$KAGGLE_SLUG" -p "$RUNNER_TEMP/nb" -m
          python - "$RUNNER_TEMP/nb/kernel-metadata.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          print("pulled_metadata", {k: m.get(k) for k in ("id", "code_file", "kernel_type", "is_private", "enable_internet", "enable_gpu", "dataset_sources")})
          if m.get("is_private") is not True:
              sys.exit(f"cannot confirm notebook is PRIVATE (is_private={m.get('is_private')!r}) - refusing to continue")
          PY
          cat workflow_code/kaggle/job.json
          python workflow_code/kaggle/launcher.py --job workflow_code/kaggle/job.json \
            --nb-dir "$RUNNER_TEMP/nb" --repo workflow_code --collector source \
            --git-sha "$GITHUB_SHA" --collector-sha "$COLLECTOR_SHA" --cred-dataset "$CRED_DATASET"
          TIMEOUT="$(python -c "import json;print(int(json.load(open('workflow_code/kaggle/job.json')).get('timeout_minutes',60)))")"
          echo "JOB_TIMEOUT_MIN=$TIMEOUT" >> "$GITHUB_ENV"

      - name: Push and run on Kaggle
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/nb" 2>&1 | tee "$RUNNER_TEMP/push.txt"
          grep -qi "successfully pushed" "$RUNNER_TEMP/push.txt" || { echo "::error::kernel push failed"; exit 2; }
          echo "PUSHED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Poll status
        shell: bash
        run: |
          set -uo pipefail
          deadline=$(( PUSHED_AT + JOB_TIMEOUT_MIN * 60 ))
          seen_active=0; final=""
          while (( $(date -u +%s) < deadline )); do
            s="$(kaggle kernels status "$KAGGLE_SLUG" 2>&1 | tr 'A-Z' 'a-z')"
            echo "$(date -u +%H:%M:%S) $s"
            if [[ "$s" == *queued* || "$s" == *running* ]]; then seen_active=1; fi
            if [[ "$s" == *complete* || "$s" == *error* || "$s" == *cancel* ]]; then
              if (( seen_active )) || (( $(date -u +%s) - PUSHED_AT > 300 )); then final="$s"; break; fi
            fi
            sleep 30
          done
          echo "KAGGLE_FINAL=${final:-timeout}" >> "$GITHUB_ENV"
          echo "final=${final:-timeout}"

      - name: Fetch log and outputs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p kaggle_out
          [[ -n "${KAGGLE_SLUG:-}" ]] || { echo "notebook not resolved; nothing to fetch"; exit 0; }
          kaggle kernels output "$KAGGLE_SLUG" -p kaggle_out 2>&1 | tail -n 20
          ls -la kaggle_out

      - name: Secret scan and summary
        if: always()
        env:
          QA_FOLDER_ID: ${{ secrets.TOKYO_L2_QA_GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kaggle_out
          if grep -rIlE 'BEGIN (RSA )?PRIVATE KEY|"private_key"' kaggle_out >/dev/null 2>&1; then
            echo "::error::credential material found in outputs; refusing to upload"; rm -rf kaggle_out; exit 2
          fi
          if [[ -n "${QA_FOLDER_ID:-}" ]] && grep -rIlF "$QA_FOLDER_ID" kaggle_out >/dev/null 2>&1; then
            echo "::error::Drive folder id found in outputs; refusing to upload"; rm -rf kaggle_out; exit 2
          fi
          {
            echo "### Kaggle job: \`${KAGGLE_SLUG:-unresolved}\` final=\`${KAGGLE_FINAL:-unknown}\`"
            for f in job_status.json secrets_precheck.json probe_report.json two_partition_report.json full_day_report.json; do
              if [[ -f "kaggle_out/$f" ]]; then echo "#### $f"; echo '```json'; head -c 12000 "kaggle_out/$f"; echo; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [[ -f kaggle_out/job_status.json ]] && cat kaggle_out/job_status.json
          [[ -f kaggle_out/run.log ]] && tail -n 60 kaggle_out/run.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-${{ github.run_id }}
          path: kaggle_out
          retention-days: 30
          if-no-files-found: warn

      - name: Fail unless Kaggle job succeeded
        shell: bash
        run: |
          set -euo pipefail
          rc="$(python -c "import json;print(json.load(open('kaggle_out/job_status.json'))['returncode'])" 2>/dev/null || echo missing)"
          echo "kaggle_final=$KAGGLE_FINAL task_rc=$rc"
          [[ "$KAGGLE_FINAL" == *complete* && "$rc" == "0" ]]
          python - <<'PY'
          import json, os, pathlib
          status = json.load(open("kaggle_out/job_status.json"))
          assert status["git_sha"] == os.environ["GITHUB_SHA"], "stale Kaggle output"
          uni_path = pathlib.Path("kaggle_out/unified_report.json")
          fd_path = pathlib.Path("kaggle_out/full_day_report.json")
          tp_path = pathlib.Path("kaggle_out/two_partition_report.json")
          if uni_path.is_file():
              report = json.loads(uni_path.read_text())
              assert report.get("status") == "complete", "unified backtest failed"
              assert report["summary"]["unified_backtest_complete"] is True
              assert report["summary"]["stage4_authorized"] is False
              assert report["summary"]["stage5c_authorized"] is False
          elif fd_path.is_file():
              report = json.loads(fd_path.read_text())
              assert report.get("status") == "complete", "full-day diagnostic backtest failed"
              assert report["summary"]["diagnostic_full_day_complete"] is True
              assert report["summary"]["stage4_authorized"] is False
          else:
              report = json.loads(tp_path.read_text())
              assert report.get("all_ok") is True, "stage 3 acceptance failed"
              assert report["summary"]["stage3_accepted"] is True
              assert report["summary"]["stage4_authorized"] is False
          PY
