name: Gate BTC Tardis G0 data compatibility probe
on:
  push:
    paths:
      - '.github/workflows/gate-btc-data-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - name: Probe Tardis Gate BTC USDT perpetual first minute
        shell: bash
        run: |
          python - <<'PY'
          import csv, gzip, io, urllib.request, tempfile, pathlib, collections, datetime, json
          from hftbacktest.data.utils import tardis
          from hftbacktest.data.validation import validate_event_order
          day='2026-11-01'; end=int(datetime.datetime(2026,11,1,tzinfo=datetime.timezone.utc).timestamp()*1e6)+60_000_000
          with tempfile.TemporaryDirectory() as d:
            paths=[]
            for kind in ['incremental_book_L2','trades']:
              url=f'https://datasets.tardis.dev/v1/gate-io-futures/{kind}/2026/11/01/BTC_USDT.csv.gz'
              p=pathlib.Path(d)/(kind+'.csv')
              req=urllib.request.Request(url,headers={'User-Agent':'mm-gate-depth20-probe'})
              n=snap=0; first=[]; seq=collections.Counter(); previous=0
              with urllib.request.urlopen(req,timeout=120) as r, gzip.GzipFile(fileobj=r) as z, io.TextIOWrapper(z,encoding='utf-8',newline='') as text, p.open('w',newline='') as out:
                rows=csv.DictReader(text); w=csv.DictWriter(out,fieldnames=rows.fieldnames);w.writeheader()
                for row in rows:
                  if int(row['local_timestamp'])>=end:break
                  if len(first)<3:first.append(row)
                  n+=1
                  if 'is_snapshot' in row and row['is_snapshot'].lower()=='true': snap+=1
                  if 'side' in row:seq[row['side']]+=1
                  if n>1_500_000:raise Exception('More than 1.5m rows in 60secs')
                  w.writerow(row)
              paths.append(str(p))
              print('FEED',kind,'rows',n,'snapshot rows',snap,'sides',dict(seq),'first',json.dumps(first),flush=True)
            arr=tardis.convert(paths,buffer_size=500000,ss_buffer_size=200000,snapshot_mode='process')
            validate_event_order(arr)
            print('CONVERT_EVENTS',len(arr),'EVENT_FLAGS',dict(collections.Counter(int(x['ev']) for x in arr[:1000])),'PRICE_RANGE',float(min(arr['px'])),float(max(arr['px'])),flush=True)
          req=urllib.request.Request('https://api.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT',headers={'User-Agent':'mm-gate-depth20-probe'})
          try:
            with urllib.request.urlopen(req,timeout=15) as r:
              c=json.load(r)
              print('CONTRACT', {k:c.get(k) for k in ['name','quanto_multiplier','order_price_round','order_size_min','maker_fee_rate','taker_fee_rate','enable_decimal']},flush=True)
          except Exception as e: print('CONTRACT_API_UNAVAILABLE',repr(e),flush=True)
          PY
