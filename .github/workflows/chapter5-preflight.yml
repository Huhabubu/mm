name: Chapter5 preflight -- code, accounting and visible-depth 50-minute smoke
on:
  push:
    branches: [exp/chapter5-robustness-cross-asset]
    paths: ['.github/workflows/chapter5-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - run: python -m py_compile scripts/core_glft_engine.py scripts/run_gate_btc_origin_glft.py scripts/aggregate_chapter5_robustness.py
      - name: Physical-arrival, cap and aggregation invariants
        run: |
          PYTHONPATH=scripts python scripts/test_core_glft_physical_fit.py
          PYTHONPATH=scripts python scripts/test_core_glft_rules.py
          PYTHONPATH=scripts python scripts/test_aggregate_chapter5_robustness.py
          PYTHONPATH=scripts python scripts/test_contract_specs.py
  historical_50m:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - day: '2026-11-01'
            name: base
          - day: '2026-06-01'
            name: cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'hftbacktest==2.4.4' numpy numba
      - name: Official Tardis/HBT two-model BTC 50m full-new-configuration pilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('configs/core_glft_physical_robustness.json').read_text())
          cfg["cap_depth_at_visible_levels"] = ('${{ matrix.name }}'=='cap')
          Path('/tmp/ch5_cfg.json').write_text(json.dumps(cfg))
          PY
          PYTHONPATH=scripts python -u scripts/run_gate_btc_origin_glft.py \
            --day '${{ matrix.day }}' --minutes 50 --symbol BTC_USDT \
            --models glft,both_1p0 --core-config /tmp/ch5_cfg.json --out smoke
      - name: Inspect strict quote-quality and cap/protection counters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('smoke').glob('*_50m.json'))
          r=json.loads(p.read_text())
          assert r['status']=='complete'
          assert r['shared_first_eligible_entry_ns']
          for v in r['variants'].values():
              assert 'position_std_contracts' in v['trading']
              assert 'gross_marked_pnl_usdt' in v['trading']
              assert set(v['quote_quality']['groups']['all']['horizons'])=={'100','500','1000'}
              d=v['depth_cap_diagnostic']
              if '${{ matrix.name }}'=='cap':
                  assert d['enabled'] and d['verified_source_20level']
                  assert d['quote_decision_checks']>0
                  assert 0<=d['insufficient_depth_fraction']<=1
              else:
                  assert not d['enabled']
          print('CH5_HBT_PREFLIGHT_OK','${{ matrix.day }}','${{ matrix.name }}')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-preflight-${{ matrix.name }}-${{ matrix.day }}
          path: smoke/*_50m.json
          if-no-files-found: warn
          retention-days: 14
