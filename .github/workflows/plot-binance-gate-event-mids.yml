name: Plot Binance Gate BTC 50min event-union mid-prices
on:
  push:
    paths:
      - '.github/workflows/plot-binance-gate-event-mids.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting packages
        run: python -m pip install numpy matplotlib
      - name: Verify backward as-of alignment on deterministic tiny tape
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import numpy as np
          from plot_binance_gate_event_mids import align
          bt=np.array([1,3,7,9], dtype=np.int64)
          bm=np.array([10.,12.,13.,14.])
          gt=np.array([2,3,5,8], dtype=np.int64)
          gm=np.array([9.,8.,10.,11.])
          t,b,g=align(bt,bm,gt,gm,2,10)
          assert t.tolist()==[2,3,5,7,8,9]
          assert b.tolist()==[10,12,12,13,13,14]
          assert g.tolist()==[9,8,10,10,11,11]
          print("CAUSAL_UNION_TEST_OK")
          PY
      - name: Download Tardis and plot 3 genuine 50-minute windows
        run: |
          python scripts/plot_binance_gate_event_mids.py \
            --days 2026-09-01 2026-10-01 2026-11-01 \
            --start 00:10:00 --minutes 50
      - name: Upload PNG plots and audit metadata
        uses: actions/upload-artifact@v4
        with:
          name: binance-gate-BTC-50min-2026-09-10-11
          path: reports/visualizations/binance_gate_mids/
          if-no-files-found: error
          retention-days: 90
      - name: Save finished plots directly in this GitHub branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/visualizations/binance_gate_mids/
          if git diff --cached --quiet; then
            echo "No changed figures"
          else
            git commit -m "analysis: publish Binance Gate 50min event-aligned price figures"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
