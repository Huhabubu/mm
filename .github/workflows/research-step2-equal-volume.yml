name: Research Step2 May-trained BTC Equal-Volume G0 test
on:
  push:
    branches: [research/sparse-source-defense-20261114]
    paths: ['.github/workflows/research-step2-equal-volume.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparse-source-defense-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - name: Training-only May 1 2026 G0 official HBT static widening
        run: |
          python scripts/experiment_source_defense_equal_volume_g0.py \
             --mode train --out reports/source_defense/equal_volume_training
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-equal-volume-may-training-selection
          path: reports/source_defense/equal_volume_training/*.json
          if-no-files-found: warn
          retention-days: 90
  june:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sparse-source-defense-20261114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install hftbacktest==2.4.4
      - uses: actions/download-artifact@v4
        with:
          name: g0-equal-volume-may-training-selection
          path: input_prior
      - name: Only apply frozen May extra halfspread to the June official HBT
        run: |
          python scripts/experiment_source_defense_equal_volume_g0.py \
            --mode test --selection input_prior/equal_volume_train.json \
            --out reports/source_defense/equal_volume_test
      - name: Compare fill number/fees to preexisting June c3_cancel without tuning
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('reports/source_defense/equal_volume_test/equal_volume_test.json').read_text())
          b=x['frozen_selected_half_spread_bps']
          v=x['test_result'][str(b)]
          target=json.loads(Path('reports/source_defense/step2_bps_summary/step2_bps_summary.json').read_text())['BTC']['reported_models']['c3_cancel']
          fill_err=abs(v['official_fills']/target['fills']-1)
          fee_err=abs(v['fee_usdt']/target['fees_usdt']-1)
          x['target_candidate']='BTC c3_cancel (chosen for proximity to 80pct), NOT selected by test optimization'
          x['target_candidate_fills']=target['fills']
          x['target_candidate_fee_usdt']=target['fees_usdt']
          x['june_fill_relative_mismatch']=fill_err
          x['june_fee_relative_mismatch']=fee_err
          x['strict_equal_volume_and_fees_lt_2pct']=(fill_err<.02 and fee_err<.02)
          Path('reports/source_defense/equal_volume_test/equal_volume_test.json').write_text(
             json.dumps(x,ensure_ascii=False,indent=2))
          lines=['# Equal-Volume G0 pretrain on 2026-05-01, validate 2026-06-01','',
                 '选择半价差只使用五月训练日G0成交数与80%事前目标，六月不参与参数选择。',
                 f"Selected static extra half spread: {b} bps",
                 f"June G0 matched fills {v['official_fills']}, pre-existing c3_cancel fills {target['fills']}",
                 f"Fill mismatch {fill_err:.2%}, fee mismatch {fee_err:.2%}",
                 f"Strict <2% match: {x['strict_equal_volume_and_fees_lt_2pct']}",
                 '若实际未达到<2%，只能称为训练日固定的近似无Binance方向基准，不能称严格等量控制。',
                 '所有经济结果均保留2bps手续费，不把无费收益作为主要成果。']
          md='\n'.join(lines)+'\n'
          Path('reports/source_defense/equal_volume_test/equal_volume_test.md').write_text(md)
          print(md)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(md)
          PY
      - name: Archive only small JSON/MD to research branch (no NPZ)
        run: |
          cp input_prior/equal_volume_train.json reports/source_defense/equal_volume_test/equal_volume_train.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/source_defense/equal_volume_test/equal_volume_train.json \
             reports/source_defense/equal_volume_test/equal_volume_test.json \
             reports/source_defense/equal_volume_test/equal_volume_test.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research(data): archive prior-trained equal-volume G0 official HBT June comparison'
          git pull --rebase origin research/sparse-source-defense-20261114
          git push origin HEAD:refs/heads/research/sparse-source-defense-20261114
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g0-equal-volume-june-test-reports
          path: reports/source_defense/equal_volume_test/*
          if-no-files-found: warn
          retention-days: 90
