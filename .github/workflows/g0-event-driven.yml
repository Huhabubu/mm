name: G0 event-driven GLFT beta-zero execution

on:
  push:
    paths:
      - 'scripts/g0_glft_event_driven.py'
      - 'scripts/run_g0_event_driven.py'
      - 'scripts/test_g0_glft_event_driven.py'
      - '.github/workflows/g0-event-driven.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0-event:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official engine 2.4.4
        run: pip install hftbacktest==2.4.4
      - name: Focused event and legacy tests
        run: |
          python -m unittest discover -s scripts -p 'test_g0_glft_event_driven.py' -v
          python -m unittest discover -s scripts -p 'test_g0_glft_rolling.py' -v
          python -m unittest discover -s scripts -p 'test_cross_venue_event_probe.py' -v
      - name: True OKX maker execution, event clock pair, legacy 100ms comparison
        run: python scripts/run_g0_event_driven.py --day 2026-11-01 --minutes 5 --extra-binance-delay-ms 25
      - name: Print aggregate paired execution metrics
        if: success()
        run: |
          python - <<'PY'
          import json
          r = json.load(open("reports/g0_event_driven_2026-11-01_5m.json"))
          for mode, v in r["modes"].items():
              print(mode, "samples", v["samples"], "decisions", v["decisions"],
                    "fills", v["trading"]["engine_fills"],
                    "net_usdt", v["trading"]["end_net_marked_equity_usdt"],
                    "fees_usdt", v["trading"]["fee_usdt"],
                    "cancels", v["trading"]["cancel_requests"],
                    "max_inventory", v["trading"]["max_abs_position_contracts"])
          print("legacy_100ms", r["legacy_100ms_G0_R_trading"])
          PY
      - name: Upload aggregates, never raw tape
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-event-driven-beta-zero-2026-11-01
          path: reports/g0_event_driven_2026-11-01_5m.json
          if-no-files-found: warn
          retention-days: 14
