# AWS Time Sync Service configuration for Tokyo ap-northeast-1 (apne1-az4)
# Enforces SPEC_v1.4 Section 4.1: |Last offset| + Root delay / 2 + Root dispersion <= 1.0 ms
server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4

driftfile /var/lib/chrony/drift
makestep 0.1 3
rtcsync
logdir /var/log/chrony
log tracking measurements statistics
